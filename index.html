<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل خدمات معردبسة - تسجيل الدخول</title>
    <style>
        @import url('https://googleapis.com');
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: #f4f7f6; color: #333; display: flex; flex-direction: column; min-height: 100vh; }
        
        .ticker-container { background-color: #0056b3; color: #ffffff; overflow: hidden; white-space: nowrap; padding: 10px 0; font-weight: 500; }
        .ticker-text { display: inline-block; padding-right: 100%; animation: marquee 25s linear infinite; }
        @keyframes marquee { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(100%, 0, 0); } }

        .login-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .login-card { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); width: 100%; max-width: 400px; border-top: 5px solid #0056b3; }
        .login-header { text-align: center; margin-bottom: 25px; }
        .login-header h1 { font-size: 22px; color: #0056b3; margin-bottom: 5px; }
        .login-header p { font-size: 14px; color: #666; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 14px; color: #444; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; text-align: right; }
        
        .remember-me-container { display: flex; align-items: center; margin-bottom: 25px; cursor: pointer; font-size: 14px; color: #555; }
        .remember-me-container input { margin-left: 8px; width: 16px; height: 16px; }
        .btn-submit { width: 100%; padding: 12px; background-color: #0056b3; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; display: block; }
    </style>
</head>
    <!-- ربط هوية وأيقونة التطبيق المطور -->
    <link rel="manifest" href="manifest.json">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
      }
    </script>

<body>

    <div class="ticker-container">
        <div class="ticker-text">
            أهلاً بكم في دليل خدمات معردبسة والقرى المحيطة بها .. سبحان الله وبحمده، سبحان الله العظيم .. لا إله إلا الله وحده لا شريك له .. نورتونا بزيارتكم الكريمة ..
        </div>
    </div>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <h1>دليل خدمات معردبسة</h1>
                <p>يرجى تسجيل الدخول للمتابعة</p>
            </div>
            
            <div class="form-group">
                <label>اسم المستخدم</label>
                <input type="text" id="username" class="form-control" placeholder="أدخل اسم المستخدم">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="password" class="form-control" placeholder="••••">
            </div>
            <label class="remember-me-container">
                <input type="checkbox" id="rememberMe">
                <span>تذكرني على هذا الجهاز</span>
            </label>
            
            <!-- ربط مباشر بالملف الثاني فور الضغط عن طريق الجافاسكريبت المباشر لتلافي أي عطل -->
            <button id="loginBtn" class="btn-submit">دخول</button>
        </div>
    </div>

    <script>
        document.getElementById('loginBtn').addEventListener('click', () => {
            const rememberMe = document.getElementById('rememberMe').checked;
            if (rememberMe) {
                localStorage.setItem('saved_username', document.getElementById('username').value);
                localStorage.setItem('saved_password', document.getElementById('password').value);
            }
            // الانتقال الفوري للملف الثاني الجديد في المجلد
            window.location.href = 'home.html';
        });

        // استرجاع تلقائي إن وجد
        window.addEventListener('DOMContentLoaded', () => {
            if(localStorage.getItem('saved_username')) {
                document.getElementById('username').value = localStorage.getItem('saved_username');
                document.getElementById('password').value = localStorage.getItem('saved_password');
                document.getElementById('rememberMe').checked = true;
            }
        });
    </script>
</body>
</html>
