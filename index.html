<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل خدمات معردبسة - تسجيل الدخول</title>
    
    <!-- استيراد خط تجول المطور -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Tajawal', sans-serif; 
        }
        
        body { 
            /* تدرج لوني عميق وعصري يتغير بشكل ملحوظ عن الرمادي القديم */
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); 
            color: #333333; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
        }
        
        /* شريط إعلانات مميز وبارز */
        .ticker-container { 
            background: #ffffff; 
            color: #1e3c72; 
            overflow: hidden; 
            white-space: nowrap; 
            padding: 14px 0; 
            font-weight: 700; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border-bottom: 3px solid #ffd700; /* خط ذهبي رفيع لإبراز الشريط */
        }
        
        .ticker-text { 
            display: inline-block; 
            padding-left: 100%; 
            animation: marquee 25s linear infinite; 
        }
        
        @keyframes marquee { 
            0% { transform: translate3d(0, 0, 0); } 
            100% { transform: translate3d(100%, 0, 0); } 
        }

        .login-wrapper { 
            flex: 1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px; 
        }
        
        /* كارت تسجيل الدخول بتصميم الزجاج الأبيض الناصع والظلال العميقة */
        .login-card { 
            background: #ffffff; 
            padding: 40px 35px; 
            border-radius: 20px; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3); 
            width: 100%; 
            max-width: 420px; 
            border-top: 8px solid #ffd700; /* تغيير شريط الكارت العلوي للذهبي الملكي لكسر الجمود */
            transition: all 0.3s ease;
        }
        
        .login-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
        }
        
        .login-header { 
            text-align: center; 
            margin-bottom: 30px; 
        }
        
        .login-header h1 { 
            font-size: 26px; 
            color: #1e3c72; 
            margin-bottom: 8px; 
            font-weight: 700;
        }
        
        .login-header p { 
            font-size: 15px; 
            color: #666666; 
        }
        
        .form-group { 
            margin-bottom: 22px; 
        }
        
        .form-group label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: 700; 
            font-size: 14px; 
            color: #1e3c72; 
        }
        
        /* حقول إدخال عصرية بخلفية ناعمة وحدود واضحة تتفاعل عند الضغط */
        .form-control { 
            width: 100%; 
            padding: 14px; 
            border: 2px solid #cbd5e1; 
            border-radius: 10px; 
            font-size: 16px; 
            text-align: right; 
            color: #333333;
            background-color: #f8fafc;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        
        /* تأثير التوهج الأزرق عند الكتابة */
        .form-control:focus {
            outline: none;
            border-color: #2a5298;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(42, 82, 152, 0.25);
        }
        
        .remember-me-container { 
            display: flex; 
            align-items: center; 
            margin-bottom: 30px; 
            cursor: pointer; 
            font-size: 15px; 
            color: #444444; 
            font-weight: 500;
            user-select: none;
        }
        
        .remember-me-container input { 
            margin-left: 10px; 
            width: 20px; 
            height: 20px; 
            cursor: pointer;
            accent-color: #1e3c72; 
        }
        
        /* زر دخول ملكي فخم بتأثير تدرج لوني ذهبي/برتقالي ناري ليتغير تماماً */
        .btn-submit { 
            width: 100%; 
            padding: 15px; 
            background: linear-gradient(135deg, #ff9900 0%, #ff5500 100%); 
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            text-align: center; 
            box-shadow: 0 5px 20px rgba(255, 85, 0, 0.3);
            transition: all 0.3s ease;
        }
        
        .btn-submit:hover {
            background: linear-gradient(135deg, #e68a00 0%, #e64d00 100%);
            box-shadow: 0 8px 25px rgba(255, 85, 0, 0.5);
            transform: scale(1.02);
        }
        
        .btn-submit:active {
            transform: scale(0.98);
        }
    </style>
</head>
    <!-- ربط هوية وأيقونة التطبيق المطور بمسار GitHub الصحيح لظهور زر التثبيت -->
    <link rel="manifest" href="/maredbseh-guide/manifest.json">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/maredbseh-guide/sw.js')
        .then(() => console.log('PWA Registered Successfully!'))
        .catch((err) => console.log('PWA Error:', err));
      }
    </script>

<body>

    <div class="ticker-container">
        <div class="ticker-text">
            أهلاً بكم في دليل خدمات معردبسة والقرى المحيطة بها .. سبحان الله وبحمده، سبحان الله العظيم .. لا إله إلا الله وحده لا شريك له .. نورتونا بزيارتكم الكريمة ..
        </div>
    </div>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <h1>دليل خدمات معردبسة</h1>
                <p>يرجى تسجيل الدخول للمتابعة</p>
            </div>
            
            <div class="form-group">
                <label>اسم المستخدم</label>
                <input type="text" id="username" class="form-control" placeholder="أدخل اسم المستخدم">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="password" class="form-control" placeholder="••••">
            </div>
            <label class="remember-me-container">
                <input type="checkbox" id="rememberMe">
                <span>تذكرني على هذا الجهاز</span>
            </label>
            
            <button id="loginBtn" class="btn-submit">دخول</button>
        </div>
    </div>

    <script>
        document.getElementById('loginBtn').addEventListener('click', () => {
            const rememberMe = document.getElementById('rememberMe').checked;
            if (rememberMe) {
                localStorage.setItem('saved_username', document.getElementById('username').value);
                localStorage.setItem('saved_password', document.getElementById('password').value);
            }
            window.location.href = 'home.html';
        });

        window.addEventListener('DOMContentLoaded', () => {
            if(localStorage.getItem('saved_username')) {
                document.getElementById('username').value = localStorage.getItem('saved_username');
                document.getElementById('password').value = localStorage.getItem('saved_password');
                document.getElementById('rememberMe').checked = true;
            }
        });
    </script>
</body>
</html>
