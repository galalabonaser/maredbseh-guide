<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الوظائف والأعمال - دليل معردبسة</title>
    
    <link href="https://googleapis.com" rel="stylesheet">
    
    <!-- مكتبات سحابة Firebase المستقرة v8 -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: #ffffff; min-height: 100vh; padding-bottom: 120px; overflow-x: hidden; }
        
        .main-container { width: 100%; max-width: 600px; margin: 20px auto; padding: 0 15px; display: flex; flex-direction: column; gap: 15px; }
        
        /* أزرار العودة */
        .btn-back-home { display: inline-flex; align-items: center; gap: 8px; color: #ffffff; text-decoration: none; font-weight: bold; font-size: 14px; background: rgba(255,255,255,0.15); padding: 8px 16px; border-radius: 20px; align-self: flex-start; border: 1px solid rgba(255,255,255,0.1); transition: background 0.2s; }
        .btn-back-home:hover { background: rgba(255,255,255,0.25); }

        .panel-title-main { font-size: 18px; font-weight: 700; color: #ffd700; text-align: center; margin-bottom: 5px; }
        
        /* التبويب المزدوج المبسط */
        .job-tabs { display: flex; gap: 10px; width: 100%; margin-top: 5px; }
        .job-tab-btn { flex: 1; background: rgba(255, 255, 255, 0.15); color: #fff; border: 1px solid rgba(255,255,255,0.1); padding: 10px; border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer; transition: all 0.2s; text-align: center; }
        .job-tab-btn.active { background: #00a884; color: #ffffff; border-color: #00a884; box-shadow: 0 4px 12px rgba(0, 168, 132, 0.3); }

        /* كارت النشر البسيط الموحد */
        .create-post-card { background: #ffffff; color: #333333; border-radius: 14px; padding: 15px; box-shadow: 0 6px 15px rgba(0,0,0,0.2); display: flex; flex-direction: column; gap: 12px; }
        .select-job-type { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccd0d5; font-size: 13px; font-weight: bold; outline: none; background: #f0f2f5; color: #333; }
        .post-textarea { width: 100%; min-height: 85px; border: 1px solid #e4e6eb; border-radius: 8px; padding: 12px; font-size: 14px; outline: none; resize: none; background: #f0f2f5; }
        .post-actions-row { display: flex; justify-content: space-between; align-items: center; }
        .upload-btn-label { background: #e4e6eb; color: #050505; padding: 8px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .btn-publish { background: #00a884; color: #ffffff; border: none; padding: 8px 22px; border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer; }
        .post-image-preview { width: 100%; max-height: 150px; border-radius: 8px; object-fit: cover; display: none; margin-top: 5px; }

        /* بطاقات عرض المنشورات */
        .post-card { background: #ffffff; color: #333333; border-radius: 14px; padding: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.15); display: flex; flex-direction: column; gap: 12px; }
        .post-header { display: flex; align-items: center; justify-content: space-between; }
        .post-user-info { display: flex; align-items: center; gap: 8px; }
        .post-avatar { width: 38px; height: 38px; border-radius: 50%; background: #ccd0d5 center center no-repeat; background-size: cover; border: 1px solid #ccd0d5; }
        .post-author-name { font-weight: bold; font-size: 13px; color: #050505; }
        .post-badge-job { background: #e8f9f0; color: #00a884; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; }
        .post-badge-job.seeking { background: #e8f4fd; color: #1877f2; }
        .btn-delete-post { background: none; border: none; color: #dc3545; font-size: 12px; font-weight: bold; cursor: pointer; display: none; padding: 4px; border-radius: 4px; }
        .btn-delete-post:hover { background: #ffebeb; }
        .post-text { font-size: 14px; color: #050505; line-height: 1.4; white-space: pre-wrap; }
        .post-main-img { width: 100%; max-height: 350px; border-radius: 8px; object-fit: cover; }

        .post-interactions-buttons { display: flex; border-top: 1px solid #e4e6eb; border-bottom: 1px solid #e4e6eb; padding: 6px 0; justify-content: space-around; }
        .interact-btn { background: none; border: none; color: #65676b; font-size: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; width: 48%; justify-content: center; padding: 6px; border-radius: 6px; text-decoration: none; }
        .interact-btn:hover { background: #f2f3f5; }
        .interact-btn.liked { color: #00a884; }
        .btn-contact-action { color: #1877f2 !important; }
        .btn-contact-action:hover { background: #e8f4fd; }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- زر العودة للشاشة الرئيسية -->
        <a href="home.html" class="btn-back-home">↩️ عودة للشاشة الرئيسية</a>

        <div class="panel-title-main">💼 لوحة الوظائف والأعمال الشاغرة</div>
        
        <!-- أزرار التبديل الثنائية السلسة بين العروض والطلبات -->
        <div class="job-tabs">
            <button id="tab-offers" class="job-tab-btn active" onclick="switchJobTab('offers')">فرص العمل المتوفرة 💼</button>
            <button id="tab-seeking" class="job-tab-btn" onclick="switchJobTab('seeking')">الباحثين عن عمل 🤝</button>
        </div>
        
        <!-- كارت إنشاء إعلان وظيفة مبسط وموحد -->
        <div class="create-post-card">
            <select id="select-job-type" class="select-job-type">
                <option value="offers">💼 أعلن عن فرصة عمل شاغرة (أصحاب المحلات والورش)</option>
                <option value="seeking">🤝 أبحث عن عمل (أصحاب المهن والمهارات والشباب)</option>
            </select>
            
            <textarea id="job-post-text" class="post-textarea" placeholder="اكتب تفاصيل الإعلان هنا بحرية.. اذكر نوع العمل أو المهارة، الشروط، ورقم هاتفك للتواصل المباشر..."></textarea>
            <img id="job-img-preview" class="post-image-preview" src="">
            
            <div class="post-actions-row">
                <label class="upload-btn-label">
                    📷 إرفاق بوستر أو صورة
                    <input type="file" id="job-post-file" accept="image/*" style="display: none;" onchange="previewJobImage(event)">
                </label>
                <button class="btn-publish" onclick="publishJobPost()">نشر الإعلان</button>
            </div>
        </div>

        <!-- حاوية عرض إعلانات الوظائف النشطة المفلترة -->
        <div id="job-posts-stream" style="display: flex; flex-direction: column; gap: 18px;">
            <!-- السكربت يضخ الإعلانات هنا تلقائياً -->
        </div>
    </div>
    <script>
        // إعدادات وبيانات اتصال فايربيس السحابية المستقرة v8
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_://firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_://firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_://appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        let isFirebaseConnected = false;
        let database = null;
        let currentJobFilter = 'offers'; // الفئة الافتراضية عند الفتح

        try {
            if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
                if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                database = firebase.database();
                isFirebaseConnected = true;
                console.log("اتصال سحابة الوظائف نشط.");
            }
        } catch (e) {
            console.warn("نمط الكاش المحلي للوظائف نشط.");
        }

        // مصفوفة كاش التخزين المحلي للأوفلاين
        let localJobPosts = JSON.parse(localStorage.getItem('job_posts_cache')) || [];

        function previewJobImage(event) {
            const reader = new FileReader();
            reader.onload = function() {
                const preview = document.getElementById('job-img-preview');
                preview.src = reader.result;
                preview.style.display = 'block';
            }
            if (event.target.files && event.target.files[0]) {
                reader.readAsDataURL(event.target.files[0]);
            }
        }

        function publishJobPost() {
            const text = document.getElementById('job-post-text').value.trim();
            const imgPreview = document.getElementById('job-img-preview').src;
            const type = document.getElementById('select-job-type').value;
            const authorName = localStorage.getItem('visitor_name') || "زائر مجهول";
            const authorAvatar = localStorage.getItem('visitor_avatar') || "";
            let uniqueAuthorId = localStorage.getItem('visitor_uid');
            
            if(!uniqueAuthorId) {
                uniqueAuthorId = "user_" + Date.now();
                localStorage.setItem('visitor_uid', uniqueAuthorId);
            }

            if (!text && (!imgPreview || imgPreview.includes(window.location.host))) {
                alert("الرجاء كتابة تفاصيل الإعلان أو إرفاق صورة أولاً قبل الضغط على النشر.");
                return;
            }

            const newPost = {
                id: "job_" + Date.now(),
                authorId: uniqueAuthorId,
                authorName: authorName,
                authorAvatar: authorAvatar,
                text: text,
                type: type,
                image: imgPreview.startsWith("data:image") ? imgPreview : "",
                likes: 0,
                likedBy: []
            };

            if (isFirebaseConnected && database) {
                database.ref(`job_posts/${newPost.id}`).set(newPost);
            } else {
                localJobPosts.unshift(newPost);
                localStorage.setItem('job_posts_cache', JSON.stringify(localJobPosts));
                renderJobPosts();
            }

            // إعادة تعيين الحقول ونظافتها بعد النشر
            document.getElementById('job-post-text').value = "";
            const preview = document.getElementById('job-img-preview');
            preview.src = "";
            preview.style.display = 'none';
            document.getElementById('job-post-file').value = "";
            alert("تم نشر إعلانك بنجاح في لوحة الوظائف! 🎉");
        }

        function switchJobTab(type) {
            currentJobFilter = type;
            
            // تبديل الألوان النشطة للأزرار العلوية
            document.getElementById('tab-offers').classList.remove('active');
            document.getElementById('tab-seeking').classList.remove('active');
            
            if(type === 'offers') document.getElementById('tab-offers').classList.add('active');
            if(type === 'seeking') document.getElementById('tab-seeking').classList.add('active');
            
            renderJobPosts();
        }
        function renderJobPosts() {
            const stream = document.getElementById('job-posts-stream');
            stream.innerHTML = "";
            const currentUserId = localStorage.getItem('visitor_uid') || "";

            if (!isFirebaseConnected) {
                const filtered = localJobPosts.filter(p => p.type === currentJobFilter);
                buildJobDOM(filtered, stream, currentUserId);
            }
        }

        function buildJobDOM(posts, container, currentUserId) {
            if(posts.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:30px; color:#cbd5e1; font-size:14px;">لا يوجد إعلانات معروضة في هذا القسم حالياً..</div>`;
                return;
            }

            posts.forEach(post => {
                const hasLiked = post.likedBy && post.likedBy.includes(currentUserId) ? "liked" : "";
                const defaultAvatar = "data:image/svg+xml;utf8,<svg xmlns='http://w3.org' viewBox='0 0 24 24' fill='%231e3c72'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5-4-8-4z'/></svg>";
                const userAvatar = post.authorAvatar ? post.authorAvatar : defaultAvatar;
                const showDeleteBtn = post.authorId === currentUserId ? "inline-block" : "none";

                const badgeText = post.type === 'offers' ? "فرصة عمل 💼" : "باحث عن عمل 🤝";
                const badgeClass = post.type === 'offers' ? "post-badge-job" : "post-badge-job seeking";

                // استخلاص أول رقم موبايل حقيقي يبدأ بـ 09 تلقائياً من النص لربطه بزر الاتصال
                const phoneMatch = post.text.match(/(09\d{8})/);
                const finalPhone = phoneMatch ? phoneMatch[0] : "";

                const card = document.createElement('div');
                card.className = "post-card";
                card.innerHTML = `
                    <div class="post-header">
                        <div class="post-user-info">
                            <div class="post-avatar" style="background-image: url('${userAvatar}')"></div>
                            <div>
                                <span class="post-author-name" style="display:block;">${post.authorName}</span>
                                <span class="${badgeClass}">${badgeText}</span>
                            </div>
                        </div>
                        <button class="btn-delete-post" style="display: ${showDeleteBtn};" onclick="deleteJobPost('${post.id}')">🗑️ حذف</button>
                    </div>
                    ${post.text ? `<p class="post-text">${post.text}</p>` : ''}
                    ${post.image ? `<img class="post-main-img" src="${post.image}">` : ''}
                    
                    <div class="post-interactions-buttons">
                        <button class="interact-btn ${hasLiked}" onclick="toggleLikeJob('${post.id}')">👍 مهتم (${post.likes || 0})</button>
                        ${finalPhone ? `<a href="tel:${finalPhone}" class="interact-btn btn-contact-action">📞 اتصل الآن</a>` : `<span class="interact-btn" style="color:#aaa; cursor:not-allowed;">📝 لا يوجد رقم</span>`}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function toggleLikeJob(postId) {
            const currentUserId = localStorage.getItem('visitor_uid') || "user_guest";
            const post = localJobPosts.find(p => p.id === postId);
            if (post) {
                if (!post.likedBy) post.likedBy = [];
                if (post.likedBy.includes(currentUserId)) {
                    post.likedBy = post.likedBy.filter(id => id !== currentUserId);
                    post.likes = Math.max(0, post.likes - 1);
                } else {
                    post.likedBy.push(currentUserId);
                    post.likes = (post.likes || 0) + 1;
                }
                localStorage.setItem('job_posts_cache', JSON.stringify(localJobPosts));
                renderJobPosts();
            }
        }

        function deleteJobPost(postId) {
            if(confirm("هل تريد إزالة إعلان هذا العمل نهائياً من اللوحة؟")) {
                localJobPosts = localJobPosts.filter(p => p.id !== postId);
                localStorage.setItem('job_posts_cache', JSON.stringify(localJobPosts));
                renderJobPosts();
                alert("تم حذف الإعلان.");
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderJobPosts();
            if(isFirebaseConnected && database) {
                database.ref('job_posts').on('value', (snapshot) => {
                    const data = snapshot.val();
                    const stream = document.getElementById('job-posts-stream');
                    stream.innerHTML = "";
                    if(data) {
                        const cloudPosts = Object.values(data).reverse();
                        const currentUserId = localStorage.getItem('visitor_uid') || "";
                        const filtered = cloudPosts.filter(p => p.type === currentJobFilter);
                        buildJobDOM(filtered, stream, currentUserId);
                    } else {
                        buildJobDOM([], stream, "");
                    }
                });
            }
        });
    </script>
</body>
</html>
