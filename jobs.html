<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قسم أبحث عن عمل</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: #ffffff; padding-bottom: 110px; min-height: 100vh; }
        .jobs-header { background: #ffffff; color: #1e3c72; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 4px 15px rgba(0,0,0,0.2); position: sticky; top: 0; z-index: 100; border-bottom: 3px solid #ffd700; }
        .back-btn { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; text-decoration: none; font-size: 13px; font-weight: bold; }
        .container { width: 100%; max-width: 600px; margin: 20px auto; padding: 0 15px; display: flex; flex-direction: column; gap: 20px; }
        .create-post-card { background: #ffffff; color: #333333; border-radius: 16px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); display: flex; flex-direction: column; gap: 15px; }
        .create-post-card h3 { font-size: 15px; color: #1e3c72; font-weight: 700; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; }
        .post-textarea { width: 100%; min-height: 90px; border: 2px solid #f1f5f9; border-radius: 10px; padding: 12px; resize: none; font-size: 15px; outline: none; color: #333333; background: #f8fafc; transition: all 0.3s; }
        .post-textarea:focus { border-color: #2a5298; background: #ffffff; }
        .post-options { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #e2e8f0; padding-top: 15px; }
        .upload-label { display: flex; align-items: center; gap: 8px; color: #16a34a; font-weight: bold; cursor: pointer; font-size: 13px; padding: 10px 14px; border-radius: 20px; background-color: #f0fdf4; border: 1px solid #bbf7d0; }
        .upload-label input { display: none; }
        .image-preview-container { display: none; width: 100%; max-height: 250px; border-radius: 10px; overflow: hidden; background: #f1f5f9; text-align: center; border: 1px solid #cbd5e1; margin-top: 5px; }
        .image-preview-container img { max-width: 100%; max-height: 250px; object-fit: contain; }
        .btn-publish { background: linear-gradient(135deg, #ff9900 0%, #ff5500 100%); color: white; border: none; padding: 10px 22px; border-radius: 20px; font-size: 14px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(255, 85, 0, 0.2); }
        .post-card { background: #ffffff; color: #333333; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); display: flex; flex-direction: column; overflow: hidden; margin-top: 15px; }
        .post-author-info { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; background: #f8fafc; border-bottom: 1px solid #f1f5f9; }
        .author-name { font-weight: 700; color: #1e3c72; font-size: 14px; }
        .delete-btn { background: none; border: none; color: #ef4444; font-size: 13px; font-weight: bold; cursor: pointer; padding: 6px 12px; border-radius: 20px; background: #fef2f2; }
        .post-content-text { padding: 16px; font-size: 15px; line-height: 1.6; color: #334155; white-space: pre-wrap; }
        .post-content-image { width: 100%; max-height: 400px; overflow: hidden; background-color: #f8fafc; display: flex; justify-content: center; align-items: center; border-top: 1px solid #f1f5f9; border-bottom: 1px solid #f1f5f9; }
        .post-content-image img { width: 100%; height: auto; max-height: 400px; object-fit: contain; }
        .post-stats { padding: 12px 16px; display: flex; justify-content: space-between; color: #64748b; font-size: 13px; border-bottom: 1px solid #f1f5f9; background: #f8fafc; }
        .post-actions { padding: 6px; display: flex; justify-content: space-around; background-color: #ffffff; border-bottom: 1px solid #f1f5f9; }
        .action-button { width: 48%; background: none; border: none; padding: 10px; color: #64748b; font-size: 14px; font-weight: 700; cursor: pointer; border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .action-button.liked { color: #0284c7; background-color: #f0f9ff; }
        .comments-section { background-color: #f8fafc; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .comment-input-box { display: flex; gap: 8px; }
        .comment-input { flex: 1; padding: 10px 16px; border: 2px solid #e2e8f0; border-radius: 20px; font-size: 13px; outline: none; background-color: white; color: #333333; }
        .comment-submit-btn { background-color: #1e3c72; color: white; border: none; padding: 0 16px; border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer; }
        .comments-list { display: flex; flex-direction: column; gap: 8px; }
        .single-comment { background-color: #e2e8f0; padding: 10px 14px; border-radius: 14px; font-size: 13px; width: fit-content; max-width: 90%; align-self: flex-start; line-height: 1.5; color: #334155; }
        .comment-user { font-weight: bold; color: #1e3c72; margin-bottom: 2px; display: block; font-size: 11px; }
        .bottom-nav { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 500px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); padding: 10px 20px; border-radius: 30px; display: flex; justify-content: space-around; box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 100; border: 1px solid rgba(255, 255, 255, 0.2); }
        .nav-link { display: flex; flex-direction: column; align-items: center; color: #1e3c72; text-decoration: none; font-size: 11px; font-weight: 700; gap: 2px; }
    </style>
</head>
<body>
    <div class="jobs-header"><a href="home.html" class="back-btn">⬅ الرئيسية</a><h1>💼 قسم أبحث عن عمل</h1><div style="width: 70px;"></div></div>
    <div class="container">
        <div class="create-post-card">
            <h3>أنشئ منشوراً للبحث عن عمل أو الإعلان عن مهنتك</h3>
            <textarea id="postText" class="post-textarea" placeholder="اكتب تخصصك، خبراتك أو تفاصيل الوظيفة المطلوبة هنا..."></textarea>
            <div class="image-preview-container" id="previewContainer"><img id="imagePreview" src="" alt="معاينة"></div>
            <div class="post-options">
                <label class="upload-label">📷 <span>إضافة صورة</span><input type="file" id="imageInput" accept="image/*"></label>
                <button id="publishBtn" class="btn-publish">نشر الإعلان</button>
            </div>
        </div>
        <div id="postsFeed"></div>
    </div>
    <div class="bottom-nav">
        <a href="home.html" class="nav-link"><span>🏠</span>الرئيسية</a>
        <a href="market.html" class="nav-link"><span>🛒</span>السوق</a>
        <a href="offers.html" class="nav-link"><span>🔥</span>العروض</a>
        <a href="emergency.html" class="nav-link"><span>🚨</span>الطوارئ</a>
    </div>
    <script>
        let uploadedImageBase64 = "";
        let localPostsData = [{
            text: "💼 إعلان كفاءة افتراضي:\nمعلم بلاط وسيراميك ذو خبرة طويلة في أعمال الكسوة والترميم ببلدة معردبسة والقرى المحيطة بها، ملتزم بالمواعيد وبأسعار مناسبة للجميع. للتواصل يرجى ترك تعليق.",
            image: "", likes: 6, isLiked: false, comments: ["شغل نظيف جداً ومجرب، بالتوفيق أبو أحمد!", "كيف يمكننا التواصل معك؟"]
        }];

        try {
            if (typeof localStorage !== 'undefined' && localStorage.getItem('jobs_posts')) {
                localPostsData = JSON.parse(localStorage.getItem('jobs_posts'));
            }
        } catch (e) { console.log("Memory active"); }

        function safeSave() {
            try {
                if (typeof localStorage !== 'undefined') {
                    localStorage.setItem('jobs_posts', JSON.stringify(localPostsData));
                }
            } catch (e) { console.log("Saved"); }
        }

        const imageInput = document.getElementById('imageInput');
        if(imageInput) {
            imageInput.addEventListener('change', function(e) {
                const files = e.target.files;
                if (files && files.length > 0) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        uploadedImageBase64 = event.target.result;
                        document.getElementById('imagePreview').src = uploadedImageBase64;
                        document.getElementById('previewContainer').style.display = 'block';
                    };
                    reader.readAsDataURL(files[0]);
                }
            });
        }

        function renderFeed() {
            const feedContainer = document.getElementById('postsFeed');
            if (!feedContainer) return;
            feedContainer.innerHTML = "";
            localPostsData.forEach((post, idx) => {
                const card = document.createElement('div');
                card.className = 'post-card';
                let imgHtml = post.image ? `<div class="post-content-image"><img src="${post.image}"></div>` : '';
                let postComments = post.comments || [];
                let commentsHtml = "";
                postComments.forEach(comm => {
                    commentsHtml += `<div class="single-comment"><span class="comment-user">👤 زائر الدليل</span>${comm}</div>`;
                });

                card.innerHTML = `
                    <div class="post-author-info"><span class="author-name">📣 مُعلن في قسم الوظائف</span><button class="delete-btn" onclick="pressDelete(${idx})">🗑️ حذف</button></div>
                    <div class="post-content-text">${post.text}</div>${imgHtml}
                    <div class="post-stats"><span>👍 <span>${post.likes}</span> إعجاب</span><span>💬 <span>${postComments.length}</span> تعليق</span></div>
                    <div class="post-actions"><button class="action-button ${post.isLiked ? 'liked' : ''}" onclick="pressLike(${idx})">👍 إعجاب</button><button class="action-button" onclick="focusCommentField(${idx})">💬 تعليق</button></div>
                    <div class="comments-section">
                        <div class="comment-input-box"><input type="text" id="input-${idx}" class="comment-input" placeholder="اكتب تعليقاً..."><button class="comment-submit-btn" onclick="pressComment(${idx})">إرسال</button></div>
                        <div class="comments-list">${commentsHtml}</div>
                    </div>`;
                feedContainer.appendChild(card);
            });
        }

        const publishBtn = document.getElementById('publishBtn');
        if(publishBtn) {
            publishBtn.addEventListener('click', () => {
                const textVal = document.getElementById('postText').value.trim();
                if(!textVal && !uploadedImageBase64) { alert("الرجاء الكتابة أو إرفاق صورة!"); return; }
                localPostsData.unshift({ text: textVal, image: uploadedImageBase64, likes: 0, isLiked: false, comments: [] });
                safeSave();
                document.getElementById('postText').value = "";
                if(document.getElementById('imageInput')) document.getElementById('imageInput').value = "";
                document.getElementById('previewContainer').style.display = 'none';
                uploadedImageBase64 = "";
                renderFeed();
            });
        }

        window.pressLike = function(idx) {
            if(localPostsData[idx].isLiked) { localPostsData[idx].likes--; localPostsData[idx].isLiked = false; }
            else { localPostsData[idx].likes++; localPostsData[idx].isLiked = true; }
            safeSave(); renderFeed();
        };

        window.focusCommentField = function(idx) {
            const field = document.getElementById(`input-${idx}`);
            if(field) field.focus();
        };

        window.pressComment = function(idx) {
            const inputField = document.getElementById(`input-${idx}`);
            if(!inputField) return;
            const commText = inputField.value.trim();
            if(!commText) return;
            localPostsData[idx].comments.push(commText);
            safeSave(); inputField.value = ""; renderFeed();
        };

        window.pressDelete = function(idx) {
            if(confirm("هل أنت متأكد من حذف هذا الإعلان؟")) {
                localPostsData.splice(idx, 1);
                safeSave(); renderFeed();
            }
        };

        renderFeed();
    </script>
</body>
</html>
