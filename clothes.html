<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المتجر الموسمي والأزياء - دليل معردبسة</title>
    
    <link href="https://googleapis.com" rel="stylesheet">
    
    <!-- مكتبات سحابة Firebase المستقرة v8 -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: #ffffff; min-height: 100vh; padding-bottom: 120px; overflow-x: hidden; }
        
        .main-container { width: 100%; max-width: 600px; margin: 20px auto; padding: 0 15px; display: flex; flex-direction: column; gap: 15px; }
        
        .btn-back-home { display: inline-flex; align-items: center; gap: 8px; color: #ffffff; text-decoration: none; font-weight: bold; font-size: 14px; background: rgba(255,255,255,0.15); padding: 8px 16px; border-radius: 20px; align-self: flex-start; border: 1px solid rgba(255,255,255,0.1); transition: background 0.2s; }
        .btn-back-home:hover { background: rgba(255,255,255,0.25); }

        .panel-title-main { font-size: 18px; font-weight: 700; color: #ffd700; text-align: center; margin-bottom: 5px; }
        
        /* أزرار التصفية العلوية الحصرية وفصل المواد */
        .filter-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 5px 0; width: 100%; scrollbar-width: none; }
        .filter-tabs::-webkit-scrollbar { display: none; }
        .tab-btn { background: rgba(255, 255, 255, 0.15); color: #fff; border: 1px solid rgba(255,255,255,0.1); padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
        .tab-btn.active { background: #ffd700; color: #1e3c72; border-color: #ffd700; box-shadow: 0 3px 10px rgba(255, 215, 0, 0.3); }

        /* كارت النشر المتطور مع تحديد القسم */
        .create-post-card { background: #ffffff; color: #333333; border-radius: 14px; padding: 15px; box-shadow: 0 6px 15px rgba(0,0,0,0.2); display: flex; flex-direction: column; gap: 10px; }
        .post-textarea { width: 100%; min-height: 75px; border: 1px solid #e4e6eb; border-radius: 8px; padding: 10px; font-size: 14px; outline: none; resize: none; background: #f0f2f5; }
        .select-category { width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid #ccd0d5; font-size: 13px; font-weight: bold; outline: none; background: #f0f2f5; color: #333; }
        .post-actions-row { display: flex; justify-content: space-between; align-items: center; }
        .upload-btn-label { background: #e4e6eb; color: #050505; padding: 8px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .btn-publish { background: #1877f2; color: #ffffff; border: none; padding: 8px 20px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .post-image-preview { width: 100%; max-height: 140px; border-radius: 8px; object-fit: cover; display: none; }

        /* كروت عرض السلع بنمط إنستغرام التجاري */
        .post-card { background: #ffffff; color: #333333; border-radius: 14px; padding: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.15); display: flex; flex-direction: column; gap: 10px; }
        .post-header { display: flex; align-items: center; justify-content: space-between; }
        .post-user-info { display: flex; align-items: center; gap: 8px; }
        .post-avatar { width: 36px; height: 36px; border-radius: 50%; background: #ccd0d5 center center no-repeat; background-size: cover; }
        .post-author-name { font-weight: bold; font-size: 13px; color: #050505; }
        .post-badge-type { background: #f2f3f5; color: #65676b; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; }
        .btn-delete-post { background: none; border: none; color: #dc3545; font-size: 12px; font-weight: bold; cursor: pointer; display: none; }
        .post-text { font-size: 14px; color: #050505; line-height: 1.4; white-space: pre-wrap; }
        .post-main-img { width: 100%; max-height: 350px; border-radius: 8px; object-fit: cover; }

        .post-interactions-buttons { display: flex; border-top: 1px solid #e4e6eb; border-bottom: 1px solid #e4e6eb; padding: 6px 0; justify-content: space-around; }
        .interact-btn { background: none; border: none; color: #65676b; font-size: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; width: 30%; justify-content: center; padding: 6px; border-radius: 6px; }
        .interact-btn:hover { background: #f2f3f5; }
        .interact-btn.liked { color: #1877f2; }
        .btn-whatsapp { color: #25d366 !important; }
        .btn-whatsapp:hover { background: #e8f9f0; }

        .comments-section { display: flex; flex-direction: column; gap: 6px; background: #f0f2f5; padding: 10px; border-radius: 8px; }
        .comment-item { display: flex; gap: 6px; font-size: 12px; }
        .comment-bubble { background: #ffffff; padding: 6px 12px; border-radius: 14px; color: #050505; }
        .comment-user { font-weight: bold; color: #1877f2; display: block; margin-bottom: 1px; }
        .comment-input-row { display: flex; gap: 6px; }
        .comment-input { flex: 1; border: 1px solid #ccd0d5; border-radius: 20px; padding: 6px 12px; font-size: 12px; outline: none; }
        .btn-send-comment { background: #1877f2; color: #fff; border: none; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; font-size: 11px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- زر العودة للشاشة الرئيسية -->
        <a href="home.html" class="btn-back-home">↩️ عودة للشاشة الرئيسية</a>

        <div class="panel-title-main">🏪 المتجر الموسمي وأزياء معردبسة</div>
        
        <!-- أزرار التصفية العلوية الذكية -->
        <div class="filter-tabs">
            <button class="tab-btn active" onclick="filterCategory('all')">الكل ✨</button>
            <button class="tab-btn" onclick="filterCategory('clothes')">أزياء وموضة 👕</button>
            <button class="tab-btn" onclick="filterCategory('heating')">مستلزمات التدفئة 🔥</button>
            <button class="tab-btn" onclick="filterCategory('shoes')">أحذية وحقائب 👜</button>
        </div>
        
        <!-- صندوق إنشاء منشور جديد مع اختيار الفئة المستهدفة -->
        <div class="create-post-card">
            <select id="post-category" class="select-category">
                <option value="clothes">👕 قسم الأزياء والموضة</option>
                <option value="heating">🔥 قسم مستلزمات التدفئة (حطب / قشر بندق / مازوت)</option>
                <option value="shoes">👜 قسم الأحذية والحقائب</option>
            </select>
            
            <textarea id="clothes-post-text" class="post-textarea" placeholder="اكتب تفاصيل السلعة والمقاسات أو السعر.. (مثال: حطب زان ممتاز للبيع، أو جاكيت شتوي تركيا) ونظام التواصل..."></textarea>
            <img id="clothes-img-preview" class="post-image-preview" src="">
            
            <div class="post-actions-row">
                <label class="upload-btn-label">
                    📷 إرفاق صورة السلعة
                    <input type="file" id="clothes-post-file" accept="image/*" style="display: none;" onchange="previewClothesImage(event)">
                </label>
                <button class="btn-publish" onclick="publishClothesPost()">نشر في المتجر</button>
            </div>
        </div>

        <!-- حاوية عرض بضائع المتجر الموسمي المفلترة -->
        <div id="clothes-posts-stream" style="display: flex; flex-direction: column; gap: 18px;">
            <!-- يتم ضخ البضائع هنا تلقائياً -->
        </div>
    </div>
    <script>
        // إعدادات فايربيس السحابية v8 - يمكنك استبدالها ببيانات مشروعك الحقيقية
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_://firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_://firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_://appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        let isFirebaseConnected = false;
        let database = null;
        let currentFilter = 'all';

        try {
            if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
                if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                database = firebase.database();
                isFirebaseConnected = true;
                console.log("اتصال سحابة المتجر الموسمي نشط.");
            }
        } catch (e) {
            console.warn("نمط الكاش المحلي للمتجر الموسمي نشط.");
        }

        let localClothesPosts = JSON.parse(localStorage.getItem('clothes_posts_cache')) || [];

        function previewClothesImage(event) {
            const reader = new FileReader();
            reader.onload = function() {
                const preview = document.getElementById('clothes-img-preview');
                preview.src = reader.result;
                preview.style.display = 'block';
            }
            if (event.target.files && event.target.files[0]) {
                reader.readAsDataURL(event.target.files[0]);
            }
        }

        function publishClothesPost() {
            const text = document.getElementById('clothes-post-text').value.trim();
            const imgPreview = document.getElementById('clothes-img-preview').src;
            const category = document.getElementById('post-category').value;
            const authorName = localStorage.getItem('visitor_name') || "تاجر مجهول";
            const authorAvatar = localStorage.getItem('visitor_avatar') || "";
            let uniqueAuthorId = localStorage.getItem('visitor_uid') || "user_" + Date.now();
            
            if(!localStorage.getItem('visitor_uid')) localStorage.setItem('visitor_uid', uniqueAuthorId);

            if (!text && (!imgPreview || imgPreview.includes(window.location.host))) {
                alert("الرجاء كتابة مواصفات بضاعتك الشتوية أو إرفاق صورة العرض أولاً.");
                return;
            }

            const newPost = {
                id: "item_" + Date.now(),
                authorId: uniqueAuthorId,
                authorName: authorName,
                authorAvatar: authorAvatar,
                text: text,
                category: category,
                image: imgPreview.startsWith("data:image") ? imgPreview : "",
                likes: 0,
                likedBy: []
            };

            if (isFirebaseConnected && database) {
                database.ref(`seasonal_store/${newPost.id}`).set(newPost);
            } else {
                localClothesPosts.unshift(newPost);
                localStorage.setItem('clothes_posts_cache', JSON.stringify(localClothesPosts));
                renderClothesPosts();
            }

            // تنظيف واجهة المدخلات
            document.getElementById('clothes-post-text').value = "";
            const preview = document.getElementById('clothes-img-preview');
            preview.src = "";
            preview.style.display = 'none';
            document.getElementById('clothes-post-file').value = "";
            alert("تم نشر عرضك بنجاح في الفئة المحددة! 🚀");
        }

        // دالة التصفية والتحويل السلس بين التبويبات العلوية
        function filterCategory(category) {
            currentFilter = category;
            
            // تحديث شكل الأزرار النشطة
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            renderClothesPosts();
        }

        function renderClothesPosts() {
            const stream = document.getElementById('clothes-posts-stream');
            stream.innerHTML = "";
            const currentUserId = localStorage.getItem('visitor_uid') || "";

            if (!isFirebaseConnected) {
                const filtered = currentFilter === 'all' ? localClothesPosts : localClothesPosts.filter(p => p.category === currentFilter);
                buildClothesDOM(filtered, stream, currentUserId);
            }
        }

        function buildClothesDOM(posts, container, currentUserId) {
            if(posts.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:30px; color:#cbd5e1; font-size:14px;">لا يوجد بضائع معروضة في هذا القسم حالياً..</div>`;
                return;
            }

            posts.forEach(post => {
                const hasLiked = post.likedBy && post.likedBy.includes(currentUserId) ? "liked" : "";
                const defaultAvatar = "data:image/svg+xml;utf8,<svg xmlns='http://w3.org' viewBox='0 0 24 24' fill='%231e3c72'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5-4-8-4z'/></svg>";
                const userAvatar = post.authorAvatar ? post.authorAvatar : defaultAvatar;
                const showDeleteBtn = post.authorId === currentUserId ? "inline-block" : "none";

                let catBadge = "أزياء";
                if(post.category === 'heating') catBadge = "مستلزمات تدفئة 🔥";
                if(post.category === 'shoes') catBadge = "أحذية وحقائب 👜";

                // استخراج أول رقم هاتف من النص تلقائياً لربطه بزر الواتساب إن وُجد
                const phoneMatch = post.text.match(/(09\d{8})/);
                const whatsappNum = phoneMatch ? "963" + phoneMatch[0].substring(1) : "963930146423"; 

                const card = document.createElement('div');
                card.className = "post-card";
                card.innerHTML = `
                    <div class="post-header">
                        <div class="post-user-info">
                            <div class="post-avatar" style="background-image: url('${userAvatar}')"></div>
                            <div>
                                <span class="post-author-name" style="display:block;">${post.authorName}</span>
                                <span class="post-badge-type">${catBadge}</span>
                            </div>
                        </div>
                        <button class="btn-delete-post" style="display: ${showDeleteBtn};" onclick="deleteClothesPost('${post.id}')">🗑️ حذف</button>
                    </div>
                    ${post.text ? `<p class="post-text">${post.text}</p>` : ''}
                    ${post.image ? `<img class="post-main-img" src="${post.image}">` : ''}
                    
                    <div class="post-interactions-buttons">
                        <button class="interact-btn ${hasLiked}" onclick="toggleLikeClothes('${post.id}')">👍 مهتم (${post.likes || 0})</button>
                        <a href="https://wa.me{whatsappNum}?text=مرحباً،%20أود%20الاستفسار%20عن%20العرض%20المعروض%20في%20متجر%20دليل%20معردبسة" target="_blank" class="interact-btn btn-whatsapp">💬 واتساب</a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function toggleLikeClothes(postId) {
            const currentUserId = localStorage.getItem('visitor_uid') || "user_guest";
            const post = localClothesPosts.find(p => p.id === postId);
            if (post) {
                if (!post.likedBy) post.likedBy = [];
                if (post.likedBy.includes(currentUserId)) {
                    post.likedBy = post.likedBy.filter(id => id !== currentUserId);
                    post.likes = Math.max(0, post.likes - 1);
                } else {
                    post.likedBy.push(currentUserId);
                    post.likes = (post.likes || 0) + 1;
                }
                localStorage.setItem('clothes_posts_cache', JSON.stringify(localClothesPosts));
                renderClothesPosts();
            }
        }

        function deleteClothesPost(postId) {
            if(confirm("هل تريد إزالة هذا العرض الموسمي من المتجر؟")) {
                localClothesPosts = localClothesPosts.filter(p => p.id !== postId);
                localStorage.setItem('clothes_posts_cache', JSON.stringify(localClothesPosts));
                renderClothesPosts();
                alert("تم الحذف.");
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderClothesPosts();
            if(isFirebaseConnected && database) {
                database.ref('seasonal_store').on('value', (snapshot) => {
                    const data = snapshot.val();
                    const stream = document.getElementById('clothes-posts-stream');
                    stream.innerHTML = "";
                    if(data) {
                        const cloudPosts = Object.values(data).reverse();
                        const currentUserId = localStorage.getItem('visitor_uid') || "";
                        const filtered = currentFilter === 'all' ? cloudPosts : cloudPosts.filter(p => p.category === currentFilter);
                        buildClothesDOM(filtered, stream, currentUserId);
                    } else {
                        buildClothesDOM([], stream, "");
                    }
                });
            }
        });
    </script>
</body>
</html>
