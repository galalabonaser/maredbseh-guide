<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوق الملابس والتخفيضات - معردبسة</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: #ffffff; display: flex; flex-direction: column; min-height: 100vh; padding-bottom: 140px; }
        .header-title { text-align: center; margin: 25px auto 10px auto; font-size: 24px; font-weight: 700; color: #ffd700; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        .main-container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 20px; margin: 0 auto; padding: 0 15px 40px 15px; }
        
        /* ✍️ صندوق النشر الذكي الموحد بخانة واحدة مثل فيسبوك */
        .create-cloth-post { background: #ffffff; color: #333333; border-radius: 16px; padding: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.3); display: flex; flex-direction: column; gap: 12px; }
        .cloth-textarea { width: 100%; height: 90px; border: none; resize: none; font-size: 15px; outline: none; padding: 5px; font-family: inherit; }
        .input-phone { width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; color: #333; outline: none; border-top: 1px solid #eee; padding-top: 10px; }
        .btn-cloth-publish { background: #1877f2; color: #ffffff; border: none; padding: 10px 25px; border-radius: 20px; font-size: 14px; font-weight: 700; cursor: pointer; align-self: flex-end; box-shadow: 0 4px 10px rgba(24,119,242,0.3); }
        .btn-cloth-publish:hover { background: #166fe5; }

        /* 👕 بطاقة التخفيضات التفاعلية الفخمة */
        .cloth-card {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            position: relative;
        }
        .cloth-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.15); padding-bottom: 8px; }
        .cloth-name { font-size: 18px; font-weight: 700; color: #ffd700; }
        .discount-badge { background: #dc3545; color: #fff; padding: 4px 12px; font-size: 13px; border-radius: 12px; font-weight: bold; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .cloth-desc { font-size: 14px; color: #e0e0e0; line-height: 1.6; white-space: pre-wrap; }
        .cloth-meta { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #ffd700; margin-top: 5px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px; }
        .btn-call { background: #28a745; color: #fff; text-decoration: none; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 5px; box-shadow: 0 4px 10px rgba(40,167,69,0.3); }
        .btn-call:hover { filter: brightness(1.1); }
        .btn-delete-cloth { background: none; border: none; color: #ff4d4d; font-size: 13px; cursor: pointer; font-weight: bold; }
        
        .bottom-nav { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 500px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); padding: 12px 20px; border-radius: 30px; display: flex; justify-content: space-around; box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 100; border: 1px solid rgba(255, 255, 255, 0.2); }
        .nav-link { display: flex; flex-direction: column; align-items: center; color: #1e3c72; text-decoration: none; font-size: 11px; font-weight: 700; gap: 4px; }
    </style>
</head>
<body>

    <h1 class="header-title">👕 محلات الألبسة والتخفيضات</h1>

    <div class="main-container">
        
        <!-- ✍️ خانة النشر الموحدة شبيهة بفيسبوك -->
        <div class="create-cloth-post">
            <textarea id="cloth-post-text" class="cloth-textarea" placeholder="اكتب اسم محلك، التخفيض، والعنوان هنا في خانة واحدة..."></textarea>
            <input type="text" id="cloth-shop-phone" class="input-phone" placeholder="أدخل رقم الهاتف للتواصل فورا (اختياري)">
            <button class="btn-cloth-publish" onclick="addNewClothPost()">نشر العرض في الصفحة</button>
        </div>

        <!-- 📰 جدار عروض الملابس التفاعلي -->
        <div id="clothes-container" style="display: flex; flex-direction: column; gap: 15px;"></div>

    </div>
    <!-- 🌟 شريط التنقل السفلي المخصص والمربوط تلقائياً بأقسام الدليل -->
    <nav class="bottom-nav">
        <a href="home.html" class="nav-link"><span>🏠</span>الرئيسية</a>
        <a href="market.html" class="nav-link"><span>🛒</span>التسوق</a>
        <a href="offers.html" class="nav-link"><span>🔥</span>قسم العروض</a>
    </nav>

    <script>
        // دالة إضافة عرض ملابس جديد وحفظه في الذاكرة التلقائية للمتصفح
        function addNewClothPost() {
            const fullText = document.getElementById('cloth-post-text').value.trim();
            const phone = document.getElementById('cloth-shop-phone').value.trim();

            if (!fullText) {
                alert("الرجاء كتابة تفاصيل العرض والتخفيض أولاً!");
                return;
            }

            const clothPosts = JSON.parse(localStorage.getItem('mared_clothes_posts_v2')) || [];

            const newCloth = {
                id: Date.now(),
                text: fullText,
                phone: phone
            };

            clothPosts.unshift(newCloth);
            localStorage.setItem('mared_clothes_posts_v2', JSON.stringify(clothPosts));

            // تفريغ الحقول بعد النشر الناجح
            document.getElementById('cloth-post-text').value = "";
            document.getElementById('cloth-shop-phone').value = "";

            renderClothPosts();
        }

        // دالة حذف عرض من الصفحة
        function deleteClothPost(id) {
            if (confirm("هل أنت متأكد من رغبتك في حذف هذا العرض التخفيضي؟")) {
                let clothPosts = JSON.parse(localStorage.getItem('mared_clothes_posts_v2')) || [];
                clothPosts = clothPosts.filter(item => item.id !== id);
                localStorage.setItem('mared_clothes_posts_v2', JSON.stringify(clothPosts));
                renderClothPosts();
            }
        }

        // بناء وعرض كافة بطاقات عروض الألبسة على الجدار للزوار
        function renderClothPosts() {
            const container = document.getElementById('clothes-container');
            container.innerHTML = "";
            const clothPosts = JSON.parse(localStorage.getItem('mared_clothes_posts_v2')) || [];

            // إذا كانت الصفحة فارغة، نعرض نموذجاً توضيحياً افتراضياً للزوار
            if (clothPosts.length === 0) {
                const defaultHTML = `
                    <div class="cloth-card">
                        <div class="cloth-header">
                            <span class="cloth-name">📣 عرض تجاري توضيحي</span>
                            <span class="discount-badge">تخفيضات نشطة 🔥</span>
                        </div>
                        <p class="cloth-desc">بوتيك الأناقة للرجال - الشارع العام مقابل المسجد الكبير.
أحدث التشكيلات الشبابية والرجالية بخصم 25% على كافة البضائع الشتوية والصيفية الحالية!</p>
                        <div class="cloth-meta">
                            <a href="tel:0900000000" class="btn-call">📞 اتصل واستفسر</a>
                            <button class="btn-delete-cloth" style="opacity:0.5; cursor:not-allowed;">❌ نموذج</button>
                        </div>
                    </div>
                `;
                container.innerHTML = defaultHTML;
                return;
            }

            clothPosts.forEach(post => {
                const postHTML = `
                    <div class="cloth-card">
                        <div class="cloth-header">
                            <span class="cloth-name">🛍️ عرض من صاحب محل</span>
                            <span class="discount-badge">عرض جديد ✨</span>
                        </div>
                        <p class="cloth-desc">${post.text}</p>
                        <div class="cloth-meta">
                            ${post.phone ? `<a href="tel:${post.phone}" class="btn-call">📞 اتصل الآن</a>` : '<span>☎️ لا يوجد هاتف</span>'}
                            <button class="btn-delete-cloth" onclick="deleteClothPost(${post.id})">❌ حذف العرض</button>
                        </div>
                    </div>
                `;
                container.innerHTML += postHTML;
            });
        }

        // تشغيل البث الفوري لعروض الألبسة عند تحميل الصفحة لأول مرة
        renderClothPosts();
    </script>
</body>
</html>
