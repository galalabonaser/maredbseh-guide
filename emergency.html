<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أرقام الطوارئ والخدمات السريعة</title>
    <style>
        @import url('https://googleapis.com');
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: #f8f9fa; color: #333; padding-bottom: 40px; }
        
        .emergency-header { background: linear-gradient(135deg, #dc3545, #bd2130); color: white; padding: 15px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 100; }
        .back-btn { background: rgba(255, 255, 255, 0.2); color: white; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; text-decoration: none; font-size: 14px; font-weight: bold; }
        
        .container { width: 100%; max-width: 580px; margin: 20px auto; padding: 0 15px; display: flex; flex-direction: column; gap: 15px; }
        .section-title { font-size: 16px; color: #666; font-weight: bold; margin-top: 5px; border-right: 4px solid #dc3545; padding-right: 8px; }
        
        .emergency-grid { display: flex; flex-direction: column; gap: 12px; }
        
        .emergency-card { background: white; border-radius: 12px; padding: 16px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 3px 6px rgba(0,0,0,0.03); border: 1px solid #e4e6eb; text-decoration: none; transition: transform 0.2s, box-shadow 0.2s; }
        .emergency-card:hover { transform: translateY(-2px); box-shadow: 0 5px 12px rgba(0,0,0,0.08); background-color: #fffdfd; }
        
        .card-info { display: flex; align-items: center; gap: 15px; }
        .card-icon { font-size: 32px; background: #fff5f5; width: 55px; height: 55px; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 1px solid #ffe3e3; }
        
        .service-name { font-size: 18px; font-weight: 700; color: #1c1e21; margin-bottom: 2px; }
        .service-desc { font-size: 13px; color: #65676b; }
        
        .phone-badge { background: #dc3545; color: white; font-size: 16px; font-weight: bold; padding: 8px 16px; border-radius: 20px; display: flex; align-items: center; gap: 6px; box-shadow: 0 2px 5px rgba(220,53,69,0.2); }
        
        .icon-police { background: #e8f0fe; border-color: #d2e3fc; }
    </style>
</head>
<body>

    <!-- شريط علوي -->
    <div class="emergency-header">
        <a href="home.html" class="back-btn">⬅ عودة للرئيسية</a>
        <h1>🚨 أرقام الطوارئ والخدمات</h1>
        <div style="width: 90px;"></div>
    </div>

    <div class="container">
        
        <h2 class="section-title">أرقام الطوارئ المعتمدة</h2>
        <div class="emergency-grid">
            
            <!-- بطاقة الدفاع المدني -->
            <a href="tel:109" class="emergency-card">
                <div class="card-info">
                    <div class="card-icon">🚒</div>
                    <div>
                        <div class="service-name">الدفاع المدني (الإطفاء)</div>
                        <div class="service-desc">لحرائق الطوارئ والإنقاذ العاجل</div>
                    </div>
                </div>
                <div class="phone-badge">📞 109</div>
            </a>

            <!-- بطاقة مخفر الشرطة -->
            <a href="tel:112" class="emergency-card">
                <div class="card-info">
                    <div class="card-icon icon-police">👮</div>
                    <div>
                        <div class="service-name">مخفر الشرطة والأمن</div>
                        <div class="service-desc">للبلاغات والشكاوى الأمنية وحفظ النظام</div>
                    </div>
                </div>
                <div class="phone-badge" style="background-color: #1a73e8; box-shadow: 0 2px 5px rgba(26,115,232,0.2);">📞 112</div>
            </a>

        </div>

    </div>

</body>
</html>
