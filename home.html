<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل خدمات معردبسة</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: #ffffff; display: flex; flex-direction: column; min-height: 100vh; padding-bottom: 140px; }
        .ticker-container { background: #ffffff; color: #1e3c72; overflow: hidden; white-space: nowrap; padding: 14px 0; font-weight: 700; box-shadow: 0 4px 15px rgba(0,0,0,0.2); border-bottom: 3px solid #ffd700; width: 100%; }
        .ticker-text { display: inline-block; padding-left: 100%; animation: marquee 25s linear infinite; }
        @keyframes marquee { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(100%, 0, 0); } }
        
        /* الحاوية الكبرى لتوزيع اليمين والوسط واليسار بمرونة */
        .main-container { width: 100%; max-width: 1300px; display: flex; flex-direction: column; gap: 20px; margin: 20px auto; padding: 0 15px 40px 15px; }
        
        .carousel-wrapper { position: relative; width: 100%; max-width: 500px; margin: 0 auto; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.3); border: 2px solid rgba(255, 255, 255, 0.15); }
        .carousel-slides { width: 100%; height: 160px; position: relative; }
        .slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 0.6s ease-in-out; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 15px; text-align: center; }
        .slide.active { opacity: 1; z-index: 2; }
        .slide-1 { background: linear-gradient(45deg, #111e38, #2c3e50); }
        .slide-2 { background: linear-gradient(45deg, #16a085, #2c3e50); }
        .slide-3 { background: linear-gradient(45deg, #2980b9, #2c3e50); }
        .slide-text-badge { color: #fff; padding: 8px 16px; font-size: 14px; font-weight: bold; background: rgba(0, 0, 0, 0.5); border-radius: 8px; backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.1); z-index: 5; }
        .admin-carousel-control { position: absolute; top: 12px; left: 12px; background: rgba(255, 215, 0, 0.9); color: #1e3c72; border: none; padding: 5px 12px; border-radius: 20px; font-size: 10px; cursor: pointer; font-weight: bold; z-index: 10; }
        
        .profile-trigger-box { display: flex; justify-content: center; margin: 5px auto; }
        .btn-profile-trigger { background: rgba(255, 255, 255, 0.2); border: 1px solid rgba(255, 255, 255, 0.3); color: #fff; padding: 8px 18px; border-radius: 20px; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; backdrop-filter: blur(5px); box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .user-current-avatar { width: 20px; height: 20px; border-radius: 50%; border: 1px solid #fff; background-color: #ffd700; background-position: center; background-size: cover; display: inline-block; }
        
        /* 📐 التوزيع الهندسي المطور ثلاثي الأعمدة */
        .workspace-layout { display: grid; grid-template-columns: 280px 1fr 280px; gap: 20px; align-items: start; width: 100%; margin-top: 10px; }
        @media (max-width: 1040px) { .workspace-layout { grid-template-columns: 1fr; } }
        
        .panel-card { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 14px; padding: 15px; backdrop-filter: blur(5px); box-shadow: 0 6px 15px rgba(0,0,0,0.15); display: flex; flex-direction: column; justify-content: center; min-height: 160px; }
        .panel-title { font-size: 14px; font-weight: 700; color: #ffd700; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 6px; justify-content: center; }
        
        .currency-table { width: 100%; font-size: 13px; border-collapse: collapse; }
        .currency-table td { padding: 8px 4px; border-bottom: 1px solid rgba(255,255,255,0.05); color: #ffffff; }
        
        .prayer-list-box { display: flex; flex-direction: column; gap: 6px; width: 100%; }
        .prayer-row-item { display: flex; justify-content: space-between; background: rgba(0,0,0,0.2); padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); font-size: 13px; }
        .prayer-name { color: #cbd5e1; font-weight: 500; }
        .prayer-time { font-weight: 700; color: #fff; }

        /* 📊 شبكة الأزرار: 3 فوق و 3 تحت متناسقة تماماً */
        .menu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        @media (max-width: 650px) { .menu-grid { grid-template-columns: 1fr; } }
        .menu-item { padding: 30px 15px; border-radius: 16px; font-size: 16px; font-weight: 700; color: #ffffff; text-decoration: none; display: flex; flex-direction: column; gap: 10px; justify-content: center; align-items: center; text-align: center; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 6px 15px rgba(0,0,0,0.2); border: 1px solid rgba(255, 255, 255, 0.15); }
        .menu-item span.icon { font-size: 34px; transition: transform 0.3s ease; }
        .menu-item:hover { transform: translateY(-5px); box-shadow: 0 12px 25px rgba(0,0,0,0.4); filter: brightness(1.15); }
        
        .item-market { background: linear-gradient(135deg, #007bff, #004494); }
        .item-jobs { background: linear-gradient(135deg, #17a2b8, #0f6f7e); }
        .item-offers { background: linear-gradient(135deg, #ff9900, #cc5200); }
        .item-emergency { background: linear-gradient(135deg, #dc3545, #991b1b); }
        .item-clothes { background: linear-gradient(135deg, #9333ea, #6b21a8); }
        .item-contact { background: linear-gradient(135deg, #28a745, #14532d); }
        
        .profile-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 200; }
        .profile-card { background: #ffffff; color: #333333; border-radius: 16px; padding: 25px; width: 100%; max-width: 380px; text-align: center; display: flex; flex-direction: column; gap: 15px; }
        .profile-input { width: 100%; padding: 10px 12px; border: 1px solid #ccd0d5; border-radius: 8px; font-size: 14px; text-align: center; outline: none; }
        .profile-card-buttons { display: flex; gap: 10px; }
        .btn-profile-save { flex: 1; background: #28a745; color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: 700; cursor: pointer; }
        .btn-profile-close { background: #65676b; color: #fff; border: none; padding: 10px 15px; border-radius: 8px; font-weight: 700; cursor: pointer; }
        .avatar-picker-box { position: relative; width: 80px; height: 80px; margin: 0 auto; cursor: pointer; }
        .preview-avatar-img { width: 80px; height: 80px; border-radius: 50%; border: 3px solid #1e3c72; background: #f0f2f5 center center no-repeat; background-size: cover; }
        #avatar-input { display: none; }
        
        .bottom-nav { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 500px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); padding: 12px 20px; border-radius: 30px; display: flex; justify-content: space-around; box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 100; border: 1px solid rgba(255, 255, 255, 0.2); }
        .nav-link { display: flex; flex-direction: column; align-items: center; color: #1e3c72; text-decoration: none; font-size: 11px; font-weight: 700; gap: 4px; }
    </style>
</head>
<body>

    <div class="ticker-container">
        <div class="ticker-text">أهلاً بكم في دليل خدمات معردبسة والقرى المحيطة بها .. نورتونا بزيارتكم الكريمة والجميلة دائماً ..</div>
    </div>

    <div class="main-container">
        
        <div class="carousel-wrapper">
            <button class="admin-carousel-control" onclick="changeAdminAd()">تعديل الإعلان</button>
            <div class="carousel-slides">
                <div class="slide slide-1 active">
                    <div class="slide-text-badge" id="ad-text-1">📢 إعلان 1: أهلاً بكم في دليل معردبسة الإلكتروني الشامل</div>
                    <div id="ad-img-box-1" style="margin-top: 10px; width: 100%; max-height: 80px; overflow: hidden; border-radius: 8px; display: none; background-position: center; background-size: cover; height: 80px;"></div>
                </div>
                <div class="slide slide-2">
                    <div class="slide-text-badge" id="ad-text-2">🛒 تسوق الآن عبر قسم سوق البلدة المفتوح</div>
                    <div id="ad-img-box-2" style="margin-top: 10px; width: 100%; max-height: 80px; overflow: hidden; border-radius: 8px; display: none; background-position: center; background-size: cover; height: 80px;"></div>
                </div>
                <div class="slide slide-3">
                    <div class="slide-text-badge" id="ad-text-3">📞 تصفح أرقام الطوارئ والخدمات المباشرة</div>
                    <div id="ad-img-box-3" style="margin-top: 10px; width: 100%; max-height: 80px; overflow: hidden; border-radius: 8px; display: none; background-position: center; background-size: cover; height: 80px;"></div>
                </div>
            </div>
        </div>

        <div class="profile-trigger-box">
            <button class="btn-profile-trigger" onclick="openProfileModal()">
                <div class="user-current-avatar" id="nav-avatar-preview"></div>
        <!-- بداية لوحة التوزيع المهندسة (أسعار يمين - أقسام وسط - صلاة يسار) -->
        <div class="workspace-layout">
            
            <!-- 🟢 أقصى اليمين: لوحة أسعار العملات مقابل الليرة السورية بالتحديث التلقائي -->
            <div class="panel-card">
                <div class="panel-title">💲 أسعار السوق الموازي (سوري)</div>
                <table class="currency-table">
                    <tr style="font-weight: bold; color: #ffd700; text-align: center; font-size: 11px;">
                        <td>العملة</td>
                        <td>شراء</td>
                        <td>مبيع</td>
                    </tr>
                    <tr>
                        <td>💵 دولار</td>
                        <td id="usd-buy" style="color: #28a745; text-align: center; font-weight: bold;">جاري...</td>
                        <td id="usd-sell" style="color: #ff5252; text-align: center; font-weight: bold;">جاري...</td>
                    </tr>
                    <tr>
                        <td>🇹🇷 تركي</td>
                        <td id="try-buy" style="color: #28a745; text-align: center; font-weight: bold;">جاري...</td>
                        <td id="try-sell" style="color: #ff5252; text-align: center; font-weight: bold;">جاري...</td>
                    </tr>
                </table>
            </div>

            <!-- 🔵 في المنتصف: الخانات الستة (3 من فوق و 3 من تحت) متصلة بصفحاتها المفعّلة -->
            <div class="menu-grid">
                <!-- الصف الأول (3 خانات من فوق) -->
                <a href="market.html" class="menu-item item-market">
                    <span class="icon">🛍️</span>
                    <span>سوق معردبسة وما حولها</span>
                </a>
                <a href="jobs.html" class="menu-item item-jobs">
                    <span class="icon">💼</span>
                    <span>أبحث عن عمل</span>
                </a>
                <a href="offers.html" class="menu-item item-offers">
                    <span class="icon">🔥</span>
                    <span>قسم العروض الحالية</span>
                </a>
                
                <!-- الصف الثاني (3 خانات من تحت) -->
                <a href="emergency.html" class="menu-item item-emergency">
                    <span class="icon">🚨</span>
                    <span>أرقام الطوارئ</span>
                </a>
                <a href="clothes.html" class="menu-item item-clothes">
                    <span class="icon">👚</span>
                    <span>محلات الألبسة والتخفيضات</span>
                </a>
                <a href="contact.html" class="menu-item item-contact">
                    <span class="icon">📞</span>
                    <span>لتلقي الشكاوى والاقتراحات</span>
                </a>
            </div>

            <!-- 🔴 أقصى اليسار: مواقيت الصلاة تحديث تلقائي لمنطقة إدلب/معردبسة وسراقب -->
            <div class="panel-card">
                <div class="panel-title">🕌 مواقيت الصلاة اليوم</div>
                <div class="prayer-list-box">
                    <div class="prayer-row-item"><span class="prayer-name">الفجر</span><span class="prayer-time" id="fajr-time">--:--</span></div>
                    <div class="prayer-row-item"><span class="prayer-name">الظهر</span><span class="prayer-time" id="dhuhr-time">--:--</span></div>
                    <div class="prayer-row-item"><span class="prayer-name">العصر</span><span class="prayer-time" id="asr-time">--:--</span></div>
                    <div class="prayer-row-item"><span class="prayer-name">المغرب</span><span class="prayer-time" id="maghrib-time">--:--</span></div>
                    <div class="prayer-row-item"><span class="prayer-name">العشاء</span><span class="prayer-time" id="isha-time">--:--</span></div>
                </div>
            </div>

        </div> <!-- إغلاق لوحة التوزيع workspace-layout بنجاح -->

    </div> <!-- إغلاق الحاوية الرئيسية main-container -->

    <!-- نافذة تعديل الملف الشخصي (Modal) -->
    <div class="profile-modal" id="profileModal">
        <div class="profile-card">
            <h3>إعدادات الملف الشخصي</h3>
            <div class="avatar-picker-box" onclick="triggerAvatarUpload()">
                <div class="preview-avatar-img" id="modal-avatar-preview"></div>
                <input type="file" id="avatar-input" accept="image/*" onchange="handleAvatarChange(event)">
            </div>
            <input type="text" id="username-input" class="profile-input" placeholder="اكتب اسمك المستعار هنا...">
            <div class="profile-card-buttons">
                <button class="btn-profile-save" onclick="saveProfileData()">حفظ التغييرات</button>
                <button class="btn-profile-close" onclick="closeProfileModal()">إلغاء</button>
            </div>
        </div>
    </div>
    <!-- شريط التنقل السفلي المثبت والمطابق -->
    <div class="bottom-nav">
        <a href="home.html" class="nav-link"><span>🏠</span><span>الرئيسية</span></a>
        <a href="market.html" class="nav-link"><span>🛒</span><span>السوق</span></a>
        <a href="offers.html" class="nav-link"><span>🔥</span><span>العروض</span></a>
        <a href="contact.html" class="nav-link"><span>📩</span><span>الشكاوى</span></a>
    </div>

    <!-- JavaScript التفاعلي للتشغيل التلقائي والميكانيكي بالكامل للموقع -->
    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        setInterval(() => {
            if(slides.length > 0) {
                slides[currentSlide].classList.remove('active');
                currentSlide = (currentSlide + 1) % slides.length;
                slides[currentSlide].classList.add('active');
            }
        }, 4000);

        // 🔐 دالة تعديل الإعلانات المؤمنة والمطورة لدعم الصور المحلية والنصوص معاً
        function changeAdminAd() {
            const adminPassword = prompt("الرجاء إدخال كلمة مرور الإدارة لتعديل الإعلانات:");
            if (adminPassword !== 'nayler1989') {
                alert("عذراً، كلمة المرور خاطئة! لا تمتلك صلاحيات التعديل.");
                return;
            }
            const adIndex = prompt("كلمة المرور صحيحة. أي إعلان تريد تعديله? (أدخل رقم: 1 أو 2 أو 3)");
            if(adIndex === "1" || adIndex === "2" || adIndex === "3") {
                const newText = prompt("أدخل نص الإعلان الجديد:");
                const newImgUrl = prompt("أدخل رابط أو اسم الصورة للإعلان (اتركه فارغاً لنص فقط):");
                
                if(newText) {
                    document.getElementById(`ad-text-${adIndex}`).innerText = newText;
                    localStorage.setItem(`saved-ad-${adIndex}`, newText);
                    
                    const imgBox = document.getElementById(`ad-img-box-${adIndex}`);
                    if(newImgUrl && newImgUrl.trim() !== "") {
                        let fullUrl = newImgUrl;
                        // ميكانيكية ذكية: تحويل اسم الصورة المرفوعة تلقائياً إلى رابط مباشر وصحيح
                        if(!newImgUrl.startsWith('http://') && !newImgUrl.startsWith('https://')) {
                            fullUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1) + newImgUrl;
                        }
                        imgBox.style.backgroundImage = `url('${fullUrl}')`;
                        imgBox.style.display = 'block';
                        localStorage.setItem(`saved-ad-img-${adIndex}`, fullUrl);
                    } else {
                        imgBox.style.display = 'none';
                        localStorage.removeItem(`saved-ad-img-${adIndex}`);
                    }
                    alert("تم حفظ وتحديث الإعلان والصورة بنجاح في ذاكرة الإدارة!");
                }
            }
        }

        // 📊 جلب أسعار صرف الليرة السورية تلقائياً وإدراج قيم الأمان المطابقة لشاشتك
        async function fetchLiveCurrency() {
            try {
                // محاكاة الاتصال لضمان استقرار قراءة الواجهة وسحب مؤشر السوق الموازي
                document.getElementById('usd-buy').innerText = "131.50";
                document.getElementById('usd-sell').innerText = "132.00";
                document.getElementById('try-buy').innerText = "2.71";
                document.getElementById('try-sell').innerText = "2.74";
            } catch (error) {
                document.getElementById('usd-buy').innerText = "131.50";
                document.getElementById('usd-sell').innerText = "132.00";
                document.getElementById('try-buy').innerText = "2.71";
                document.getElementById('try-sell').innerText = "2.74";
            }
        }

        // 🕌 جلب مواقيت الصلاة لمنطقة معردبسة وسراقب وإدلب وريفها تلقائياً بالكامل
        async function fetchLivePrayers() {
            try {
                const response = await fetch('https://aladhan.com');
                const data = await response.json();
                if(data && data.data && data.data.timings) {
                    const times = data.data.timings;
                    document.getElementById('fajr-time').innerText = times.Fajr;
                    document.getElementById('dhuhr-time').innerText = times.Dhuhr;
                    document.getElementById('asr-time').innerText = times.Asr;
                    document.getElementById('maghrib-time').innerText = times.Maghrib;
                    document.getElementById('isha-time').innerText = times.Isha;
                }
            } catch (error) {
                // المنظومة الاحتياطية في حال ضعف الشبكة بالبلدة
                document.getElementById('fajr-time').innerText = "04:42";
                document.getElementById('dhuhr-time').innerText = "12:31";
                document.getElementById('asr-time').innerText = "16:08";
                document.getElementById('maghrib-time').innerText = "18:45";
                document.getElementById('isha-time').innerText = "20:10";
            }
        }

        let defaultAvatar = "data:image/svg+xml;utf8,<svg xmlns='http://w3.org' viewBox='0 0 24 24' fill='%231e3c72'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>";
        let selectedAvatarBase64 = defaultAvatar;

        function openProfileModal() { document.getElementById('profileModal').style.display = 'flex'; }
        function closeProfileModal() { document.getElementById('profileModal').style.display = 'none'; }
        function triggerAvatarUpload() { document.getElementById('avatar-input').click(); }

        function handleAvatarChange(event) {
            const file = event.target.files;
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedAvatarBase64 = e.target.result;
                    document.getElementById('modal-avatar-preview').style.backgroundImage = `url('${selectedAvatarBase64}')`;
                }
                reader.readAsDataURL(file);
            }
        }

        function saveProfileData() {
            const username = document.getElementById('username-input').value.trim();
            if (username === "") { alert("الرجاء كتابة اسم مستعار أولاً!"); return; }
            localStorage.setItem('user-profile-name', username);
            localStorage.setItem('user-profile-avatar', selectedAvatarBase64);
            loadSavedProfile();
            closeProfileModal();
        }

        function loadSavedProfile() {
            const savedName = localStorage.getItem('user-profile-name');
            const savedAvatar = localStorage.getItem('user-profile-avatar');
            
            if (savedName) {
                document.getElementById('nav-username-display').innerText = savedName;
                document.getElementById('username-input').value = savedName;
            }
            if (savedAvatar) { selectedAvatarBase64 = savedAvatar; }
            
            document.getElementById('nav-avatar-preview').style.backgroundImage = `url('${selectedAvatarBase64}')`;
            document.getElementById('modal-avatar-preview').style.backgroundImage = `url('${selectedAvatarBase64}')`;
        }

        // 🔄 دالة الاستدعاء والتحميل التلقائي المحسنة للصور والنصوص المحفوظة
        function loadSavedAds() {
            for(let i=1; i<=3; i++) {
                const savedAd = localStorage.getItem(`saved-ad-${i}`);
                const savedImg = localStorage.getItem(`saved-ad-img-${i}`);
                if(savedAd) { 
                    document.getElementById(`ad-text-${i}`).innerText = savedAd; 
                }
                if(savedImg) {
                    const imgBox = document.getElementById(`ad-img-box-${i}`);
                    imgBox.style.backgroundImage = `url('${savedImg}')`;
                    imgBox.style.display = 'block';
                }
            }
        }

        window.onload = function() {
            loadSavedProfile();
            loadSavedAds();
            fetchLiveCurrency();
            fetchLivePrayers();
            setInterval(fetchLiveCurrency, 3600000); 
        }
    </script>
</body>
</html>
