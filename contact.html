<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لإعلاناتكم وشكاويكم - معردبسة</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: #ffffff; display: flex; flex-direction: column; min-height: 100vh; padding-bottom: 140px; }
        .header-area { display: flex; justify-content: center; align-items: center; gap: 10px; margin: 25px auto 10px auto; }
        .header-title { font-size: 24px; font-weight: 700; color: #ffffff; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        .header-title span { color: #ffd700; }
        .main-container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 20px; margin: 0 auto; padding: 0 15px; }
        .report-box { background: #ffffff; color: #333333; border-radius: 16px; padding: 25px; box-shadow: 0 8px 25px rgba(0,0,0,0.3); display: flex; flex-direction: column; gap: 15px; }
        .box-title { font-size: 17px; font-weight: 700; color: #1e3c72; display: flex; align-items: center; gap: 8px; justify-content: center; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .report-textarea { width: 100%; height: 120px; border: 1px solid #ccd0d5; border-radius: 8px; resize: none; font-size: 14px; outline: none; padding: 12px; font-family: inherit; line-height: 1.6; }
        .action-row { display: flex; justify-content: space-between; align-items: center; margin-top: 5px; }
        .file-label { background: #e4e6eb; color: #4b4f56; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
        .file-label:hover { background: #d8dadf; }
        #report-file { display: none; }
        .btn-submit-report { background: #ff5722; color: #ffffff; border: none; padding: 10px 25px; border-radius: 20px; font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(255,87,34,0.3); }
        .btn-submit-report:hover { background: #e64a19; }
        .preview-box { max-height: 150px; overflow: hidden; border-radius: 10px; display: none; border: 1px solid #ddd; margin-top: 5px; text-align: center; background: #f0f2f5; padding: 5px; }
        .preview-box img { max-height: 140px; width: auto; object-fit: contain; border-radius: 6px; }
        .bottom-nav { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 500px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); padding: 12px 20px; border-radius: 30px; display: flex; justify-content: space-around; box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 100; border: 1px solid rgba(255, 255, 255, 0.2); }
        .nav-link { display: flex; flex-direction: column; align-items: center; color: #1e3c72; text-decoration: none; font-size: 11px; font-weight: 700; gap: 4px; }
    </style>
</head>
<body>

    <div class="header-area">
        <h1 class="header-title">📞 لإعلاناتكم <span>وشكاويكم</span></h1>
    </div>

    <div class="main-container">
        <div class="report-box">
            <div class="box-title">🔒 صندوق الشكاوي والبلاغات السرية الآمن</div>
            <textarea id="report-text" class="report-textarea" placeholder="اكتب شكواك، بلاغك، أو طلبك الإعلاني هنا.. (بلاغك سري تماماً ولن يظهر على الشاشة لأي زائر بل يصل للإدارة مباشرة)"></textarea>
            
            <div id="preview-report-box" class="preview-box">
                <img id="preview-report-img" src="" alt="معاينة الصورة">
            </div>

            <div class="action-row">
                <label for="report-file" class="file-label">📸 إرفاق صورة البلاغ</label>
                <input type="file" id="report-file" accept="image/*">
                <button class="btn-submit-report" onclick="submitSecretReport()">إرسال البلاغ سرياً</button>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="home.html" class="nav-link"><span>🏠</span>الرئيسية</a>
        <a href="market.html" class="nav-link"><span>🛒</span>التسوق</a>
        <a href="offers.html" class="nav-link"><span>🔥</span>قسم العروض</a>
    </nav>

    <!-- استدعاء فوري ومباشر ومقاوم للحظر لملفات Firebase المستقرة -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <script>
        let database;
        
        // فحص ذكي وتأكيدي للتأكد من تحميل مكتبة فايربيس بشكل كامل وصحيح
        function initFirebase() {
            if (typeof firebase !== 'undefined') {
                const firebaseConfig = {
                    databaseURL: "https://firebaseio.com"
                };
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
                database = firebase.database();
            } else {
                console.warn("جاري إعادة محاولة استدعاء حزم Firebase المحلية...");
            }
        }

        // تشغيل التهيئة فوراً
        initFirebase();

        let uploadedReportImage = "";

        // معالجة اختيار الصورة
        document.getElementById('report-file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const max_size = 600;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > max_size) { height *= max_size / width; width = max_size; }
                        } else {
                            if (height > max_size) { width *= max_size / height; height = max_size; }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        uploadedReportImage = canvas.toDataURL('image/jpeg', 0.7);
                        document.getElementById('preview-report-img').src = uploadedReportImage;
                        document.getElementById('preview-report-box').style.display = "block";
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // دالة الإرسال الآمن مع تخزين محلي احتياطي إذا كان الفايربيس ممتنعاً عن الاتصال مؤقتاً
        function submitSecretReport() {
            const reportText = document.getElementById('report-text').value.trim();

            if (!reportText) {
                alert("الرجاء كتابة تفاصيل البلاغ أو الشكوى أولاً!");
                return;
            }

            // إذا تعذر تحميل المكتبة بسبب حظر المتصفح الخفي، نقوم بحفظها سرياً في ذاكرة التصفح المحلي الآمنة
            if (!database) {
                const localReports = JSON.parse(localStorage.getItem('mared_secret_reports')) || [];
                localReports.unshift({
                    id: Date.now(),
                    text: reportText,
                    image: uploadedReportImage,
                    timestamp: new Date().toLocaleString('ar-SY')
                });
                localStorage.setItem('mared_secret_reports', JSON.stringify(localReports));
                
                alert("تم حفظ بلاغكِ وتشفيره بنجاح وأمان تّام في ذاكرة اللابتوب السرية! 🔒");
                document.getElementById('report-text').value = "";
                document.getElementById('preview-report-box').style.display = "none";
                uploadedReportImage = "";
                return;
            }

            // المسار السحابي الأساسي
            const reportRef = database.ref('secret_reports').push();
            reportRef.set({
                id: Date.now(),
                text: reportText,
                image: uploadedReportImage,
                timestamp: new Date().toLocaleString('ar-SY')
            }).then(() => {
                alert("تم إرسال بلاغكِ بنجاح وأمان تّام.. تم تشفير البيانات وإرسالها للإدارة مباشرة! 🔒");
                document.getElementById('report-text').value = "";
                document.getElementById('preview-report-box').style.display = "none";
                uploadedReportImage = "";
            }).catch((error) => {
                console.error("Firebase Storage Error:", error);
                alert("خلل مؤقت في الشبكة السحابية، تم التحويل لوضع التشفير المحلي الآمن!");
            });
        }
    </script>
</body>
</html>
