<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اتصل بنا - دليل معردبسة</title>
    
    <link href="https://googleapis.com" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: #ffffff; min-height: 100vh; padding-bottom: 60px; overflow-x: hidden; }
        
        .main-container { width: 100%; max-width: 550px; margin: 30px auto; padding: 0 15px; display: flex; flex-direction: column; gap: 20px; }
        
        .btn-back-home { display: inline-flex; align-items: center; gap: 8px; color: #ffffff; text-decoration: none; font-weight: bold; font-size: 14px; background: rgba(255,255,255,0.15); padding: 8px 16px; border-radius: 20px; align-self: flex-start; border: 1px solid rgba(255,255,255,0.1); transition: background 0.2s; }
        .btn-back-home:hover { background: rgba(255,255,255,0.25); }

        .panel-title-main { font-size: 18px; font-weight: 700; color: #ffd700; text-align: center; margin-bottom: 5px; }
        
        .contact-card { background: #ffffff; color: #333333; border-radius: 16px; padding: 25px; box-shadow: 0 8px 25px rgba(0,0,0,0.2); display: flex; flex-direction: column; gap: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .secure-badge { background: #e8f9f0; color: #28a745; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; display: inline-flex; align-items: center; gap: 6px; align-self: center; margin-bottom: 5px; }
        
        .form-label { font-size: 13px; font-weight: bold; color: #4b4b4b; margin-bottom: -5px; }
        .contact-textarea { width: 100%; min-height: 120px; border: 1px solid #ccd0d5; border-radius: 10px; padding: 12px; font-size: 14px; outline: none; resize: none; background: #f0f2f5; transition: border-color 0.2s; }
        .contact-textarea:focus { border-color: #25d366; }
        
        .upload-row { display: flex; flex-direction: column; gap: 8px; }
        .upload-label { background: #f0f2f5; color: #4b4b4b; padding: 12px; border-radius: 10px; font-size: 13px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; border: 2px dashed #ccd0d5; text-align: center; transition: all 0.2s; }
        .upload-label:hover { background: #e8f4fd; border-color: #1877f2; }
        .img-preview { width: 100%; max-height: 160px; border-radius: 8px; object-fit: cover; display: none; margin-top: 5px; border: 1px solid #ccd0d5; }
        
        .btn-submit-whatsapp { background: #25d366; color: #ffffff; border: none; padding: 12px; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3); transition: background 0.2s, transform 0.1s; }
        .btn-submit-whatsapp:hover { background: #20ba5a; transform: translateY(-1px); }
    </style>
</head>
<body>

    <div class="main-container">
        <a href="home.html" class="btn-back-home">↩️ عودة للشاشة الرئيسية</a>

        <div class="panel-title-main">📬 صندوق المراسلة والشكاوى الآمن</div>
        
        <div class="contact-card">
            <div class="secure-badge">🔒 محادثة مشفرة وسرية تماماً مع إدارة الدليل</div>
            
            <p style="font-size: 13px; color: #65676b; text-align: center; line-height: 1.5; margin-bottom: 10px;">
                رسالتك وصورتك ستصل مباشرة إلى الواتساب الخاص بمدير الدليل دون حفظها في أي مكان آخر لضمان السرية المطلقة والخصوصية التامة.
            </p>

            <span class="form-label">اكتب شكواك أو مقترحك هنا:</span>
            <textarea id="complaint-text" class="contact-textarea" placeholder="اكتب تفاصيل الرسالة أو الشكوى أو المقترح بوضوح هنا..."></textarea>
            
            <div class="upload-row">
                <span class="form-label">إرفاق صورة توضيحية للشكوى (اختياري):</span>
                <label class="upload-label">
                    📷 اضغط هنا لاختيار صورة الشكوى
                    <input type="file" id="complaint-file" accept="image/*" style="display: none;" onchange="previewComplaintImage(event)">
                </label>
                <img id="complaint-img-preview" class="img-preview" src="">
            </div>

            <button class="btn-submit-whatsapp" onclick="sendToWhatsApp()">
                💬 إرسال الشكوى مباشرة عبر واتساب
            </button>
        </div>
    </div>
    <script>
        // إصلاح دالة المعاينة الحية للصور لقراءة الملف الأول بشكل سليم بدون تجميد
        function previewComplaintImage(event) {
            const fileInput = event.target;
            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function() {
                    const preview = document.getElementById('complaint-img-preview');
                    preview.src = reader.result;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(fileInput.files[0]);
            }
        }

        // دالة الرفع والتوجيه لخادم الواتساب المباشر المصلحة كلياً
        async function sendToWhatsApp() {
            const text = document.getElementById('complaint-text').value.trim();
            const fileInput = document.getElementById('complaint-file');
            const button = document.querySelector('.btn-submit-whatsapp');
            
            // رقم واتساب الإدارة الحقيقي والمباشر الخاص بك
            const adminWhatsAppNumber = "963983470302"; 

            if (!text) {
                alert("الرجاء كتابة نص الشكوى أو الرسالة أولاً قبل الإرسال.");
                return;
            }

            button.innerText = "جاري معالجة طلبك والرفع... ⏳";
            button.style.background = "#aaa";
            button.disabled = true;

            let finalMessage = `🚨 *بلاغ / شكوى سرية جديدة من دليل معردبسة*:\n\n${text}`;

            // إصلاح دالة معالجة ورفع الصورة للويب وتحويلها لرابط مشفر
            if (fileInput.files && fileInput.files[0]) {
                const formData = new FormData();
                formData.append('image', fileInput.files[0]); // إصلاح قراءة مصفوفة الملف [0]

                try {
                    // استخدام واجهة API مستقرة مع مفتاح الرفع السحابي الفعال
                    const response = await fetch('https://imgbb.com', {
                        method: 'POST',
                        body: formData
                    });
                    const result = await response.json();

                    if (result && result.success && result.data && result.data.url) {
                        const imageUrl = result.data.url;
                        finalMessage += `\n\n🖼️ *رابط صورة الشكوى المرفقة*:\n${imageUrl}`;
                    }
                } catch (error) {
                    console.error("خطأ رفع الصورة:", error);
                    finalMessage += `\n\n⚠️ (فشل دمج رابط الصورة تلقائياً، يرجى إرفاقها يدوياً للمشرف في محادثة الواتساب)`;
                }
            }

            // تشفير النص ليتوافق مع الروابط الرسمية
            const encodedText = encodeURIComponent(finalMessage);
            
            // إصلاح دمج الرابط المباشر باستخدام النطاق الرسمي ://whatsapp.com لمنع مشاكل المتصفحات
            const whatsappUrl = "https://://whatsapp.com/send?phone=" + adminWhatsAppNumber + "&text=" + encodedText;

            // إعادة تعيين شكل وثبات الزر الافتراضي
            button.innerHTML = "💬 إرسال الشكوى مباشرة عبر واتساب";
            button.style.background = "#25d366";
            button.disabled = false;

            // إظهار رسالة تأكيد النجاح لمنع التكرار وطمأنة الزائر
            alert("تمت معالجة شكواك بنجاح! سيتم توجيهك الآن إلى تطبيق الواتساب لإتمام الإرسال السري والمباشر للإدارة. 🎉");

            // تنظيف الحقول تلقائياً لحماية سرية البيانات
            document.getElementById('complaint-text').value = "";
            const preview = document.getElementById('complaint-img-preview');
            if (preview) {
                preview.src = "";
                preview.style.display = 'none';
            }
            document.getElementById('complaint-file').value = "";

            // فتح محادثة الواتساب الآمنة وتمرير البلاغ فوراً
            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
</html>
