<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوق معردبسة وما حولها - بيع وشراء</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: #ffffff; display: flex; flex-direction: column; min-height: 100vh; padding-bottom: 140px; }
        .header-title { text-align: center; margin: 20px auto 5px auto; font-size: 22px; font-weight: 700; color: #ffd700; }
        .main-container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 20px; margin: 0 auto; padding: 0 15px; }
        .create-post { background: #ffffff; color: #333333; border-radius: 16px; padding: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.3); display: flex; flex-direction: column; gap: 12px; }
        .post-textarea { width: 100%; height: 80px; border: none; resize: none; font-size: 15px; outline: none; padding: 5px; font-family: inherit; }
        .price-input { width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-weight: bold; color: #28a745; outline: none; }
        .post-actions { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #eee; padding-top: 10px; }
        .file-label { background: #e4e6eb; color: #4b4f56; padding: 8px 15px; border-radius: 20px; font-size: 13px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
        .file-label:hover { background: #d8dadf; }
        #file-input { display: none; }
        .btn-publish { background: #1877f2; color: #ffffff; border: none; padding: 8px 25px; border-radius: 20px; font-size: 14px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 10px rgba(24,119,242,0.3); }
        .btn-publish:hover { background: #166fe5; }
        .preview-img-box { max-height: 150px; overflow: hidden; border-radius: 10px; display: none; margin-top: 5px; }
        .preview-img-box img { width: 100%; height: auto; object-fit: cover; }
        .posts-feed { display: flex; flex-direction: column; gap: 15px; margin-top: 10px; }
        .post-card { background: #ffffff; color: #1c1e21; border-radius: 16px; padding: 15px; box-shadow: 0 6px 15px rgba(0,0,0,0.2); display: flex; flex-direction: column; gap: 10px; position: relative; }
        .post-card-header { display: flex; justify-content: space-between; align-items: center; }
        .user-info { display: flex; align-items: center; gap: 8px; }
        .user-avatar { width: 36px; height: 36px; background: #1e3c72; color: #fff; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 14px; }
        .user-name-time { display: flex; flex-direction: column; }
        .u-name { font-size: 14px; font-weight: 700; color: #050505; }
        .u-time { font-size: 11px; color: #65676b; }
        .btn-delete { background: none; border: none; color: #ee2a2a; font-size: 13px; cursor: pointer; font-weight: bold; }
        .post-content { font-size: 15px; color: #050505; line-height: 1.5; white-space: pre-wrap; }
        .post-price-badge { display: inline-block; background: #e7f3ff; color: #1877f2; padding: 4px 12px; border-radius: 6px; font-weight: 700; font-size: 14px; align-self: flex-start; }
        .post-img { width: 100%; max-height: 350px; object-fit: cover; border-radius: 8px; margin-top: 5px; }
        .post-stats { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #ced0d4; font-size: 12px; color: #65676b; }
        .post-buttons { display: flex; justify-content: space-around; padding: 5px 0; border-bottom: 1px solid #ced0d4; }
        .react-btn { background: none; border: none; color: #65676b; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; width: 50%; justify-content: center; padding: 6px; border-radius: 6px; }
        .react-btn:hover { background: #f2f3f5; }
        .react-btn.liked { color: #1877f2; }
        .comments-section { display: flex; flex-direction: column; gap: 8px; margin-top: 5px; }
        .comment-item { background: #f0f2f5; padding: 8px 12px; border-radius: 12px; font-size: 13px; color: #050505; max-width: 90%; align-self: flex-start; }
        .comment-input-box { display: flex; gap: 8px; margin-top: 5px; }
        .comment-input { flex: 1; padding: 6px 12px; border: 1px solid #ccd0d5; border-radius: 20px; font-size: 13px; outline: none; background: #f0f2f5; }
        .btn-comment-send { background: #1877f2; color: #fff; border: none; padding: 4px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; font-weight: bold; }
        .bottom-nav { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 500px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); padding: 12px 20px; border-radius: 30px; display: flex; justify-content: space-around; box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 100; border: 1px solid rgba(255, 255, 255, 0.2); }
        .nav-link { display: flex; flex-direction: column; align-items: center; color: #1e3c72; text-decoration: none; font-size: 11px; font-weight: 700; gap: 4px; }
    </style>
</head>
<body>
    <h1 class="header-title">🛍️ سوق معردبسة وما حولها للبيع والشراء</h1>
    <div class="main-container">
        <div class="create-post">
            <textarea id="post-text" class="post-textarea" placeholder="بماذا تفكر؟ اكتب تفاصيل منتجك أو عرضك هنا..."></textarea>
            <input type="text" id="post-price" class="price-input" placeholder="السعر المتوقع (مثال: 50,000 ل.س أو حسب الاتفاق)">
            <div id="preview-box" class="preview-img-box">
                <img id="preview-img" src="" alt="معاينة الصورة">
            </div>
            <div class="post-actions">
                <label for="file-input" class="file-label">🖼️ أضف صورة العرض</label>
                <input type="file" id="file-input" accept="image/*">
                <button id="btn-publish" class="btn-publish" onclick="addNewPost()">نشر في السوق</button>
            </div>
        </div>
        <div id="posts-container" class="posts-feed"></div>
    </div>
    <nav class="bottom-nav">
        <a href="home.html" class="nav-link"><span>🏠</span>الرئيسية</a>
        <a href="offers.html" class="nav-link"><span>🔥</span>قسم العروض</a>
        <a href="jobs.html" class="nav-link"><span>💼</span>وظائف وعمل</a>
    </nav>
    <script>
        let uploadedImageBase64 = "";

        // معالجة اختيار صورة من الجهاز وتحويلها لقراءة فورية
        document.getElementById('file-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    uploadedImageBase64 = event.target.result;
                    document.getElementById('preview-img').src = uploadedImageBase64;
                    document.getElementById('preview-box').style.display = "block";
                };
                reader.readAsDataURL(file);
            }
        });

        // دالة إضافة منشور جديد وحفظه في ذاكرة المتصفح التلقائية
        function addNewPost() {
            const text = document.getElementById('post-text').value.trim();
            const price = document.getElementById('post-price').value.trim();

            if (!text) {
                alert("الرجاء كتابة تفاصيل المنشور أولاً!");
                return;
            }

            const posts = JSON.parse(localStorage.getItem('mared_market_posts')) || [];
            
            const newPost = {
                id: Date.now(),
                text: text,
                price: price,
                image: uploadedImageBase64,
                likes: 0,
                likedByMe: false,
                comments: [],
                time: "الآن"
            };

            posts.unshift(newPost);
            localStorage.setItem('mared_market_posts', JSON.stringify(posts));

            // تفريغ الحقول بعد النشر
            document.getElementById('post-text').value = "";
            document.getElementById('post-price').value = "";
            document.getElementById('preview-box').style.display = "none";
            uploadedImageBase64 = "";

            renderPosts();
        }

        // دالة حذف المنشور
        function deletePost(id) {
            if(confirm("هل أنت متأكد من رغبتك في حذف هذا المنشور من السوق؟")) {
                let posts = JSON.parse(localStorage.getItem('mared_market_posts')) || [];
                posts = posts.filter(p => p.id !== id);
                localStorage.setItem('mared_market_posts', JSON.stringify(posts));
                renderPosts();
            }
        }

        // دالة الإعجاب والضغط على زر لايك
        function toggleLike(id) {
            const posts = JSON.parse(localStorage.getItem('mared_market_posts')) || [];
            const post = posts.find(p => p.id === id);
            if (post) {
                if (post.likedByMe) {
                    post.likes--;
                    post.likedByMe = false;
                } else {
                    post.likes++;
                    post.likedByMe = true;
                }
                localStorage.setItem('mared_market_posts', JSON.stringify(posts));
                renderPosts();
            }
        }

        // دالة إضافة تعليق جديد
        function addComment(id) {
            const input = document.getElementById(`c-input-${id}`);
            const commentText = input.value.trim();
            if (!commentText) return;

            const posts = JSON.parse(localStorage.getItem('mared_market_posts')) || [];
            const post = posts.find(p => p.id === id);
            if (post) {
                post.comments.push(commentText);
                localStorage.setItem('mared_market_posts', JSON.stringify(posts));
                input.value = "";
                renderPosts();
            }
        }

        // بناء وعرض كافة المنشورات والتعليقات على الجدار للزوار
        function renderPosts() {
            const container = document.getElementById('posts-container');
            container.innerHTML = "";
            const posts = JSON.parse(localStorage.getItem('mared_market_posts')) || [];

            if (posts.length === 0) {
                container.innerHTML = `<p style="text-align:center;color:#e0e0e0;font-size:14px;margin-top:20px;">السوق شاغر حالياً.. كن أول من ينشر معروضاً الآن! 🛍️</p>`;
                return;
            }

            posts.forEach(post => {
                let commentsHTML = "";
                post.comments.forEach(c => {
                    commentsHTML += `<div class="comment-item">${c}</div>`;
                });

                const postHTML = `
                    <div class="post-card">
                        <div class="post-card-header">
                            <div class="user-info">
                                <div class="user-avatar">👤</div>
                                <div class="user-name-time">
                                    <span class="u-name">تاجر / زائر في السوق</span>
                                    <span class="u-time">${post.time}</span>
                                </div>
                            </div>
                            <button class="btn-delete" onclick="deletePost(${post.id})">❌ حذف</button>
                        </div>
                        
                        <p class="post-content">${post.text}</p>
                        
                        ${post.price ? `<span class="post-price-badge">💰 السعر: ${post.price}</span>` : ''}
                        ${post.image ? `<img src="${post.image}" class="post-img" alt="صورة المنشور">` : ''}
                        
                        <div class="post-stats">
                            <span>👍 ${post.likes} إعجاب</span>
                            <span>💬 ${post.comments.length} تعليق</span>
                        </div>
                        
                        <div class="post-buttons">
                            <button class="react-btn ${post.likedByMe ? 'liked' : ''}" onclick="toggleLike(${post.id})">
                                👍 ${post.likedByMe ? 'تم الإعجاب' : 'إعجاب'}
                            </button>
                            <button class="react-btn" onclick="document.getElementById('c-input-${post.id}').focus()">
                                💬 تعليق
                            </button>
                        </div>
                        
                        <div class="comments-section">
                            <div id="comments-box-${post.id}">${commentsHTML}</div>
                            <div class="comment-input-box">
                                <input type="text" id="c-input-${post.id}" class="comment-input" placeholder="اكتب تعليقاً في السوق...">
                                <button class="btn-comment-send" onclick="addComment(${post.id})">إرسال</button>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += postHTML;
            });
        }

        // تشغيل البث الفوري للمنشورات عند تحميل الصفحة
        renderPosts();
    </script>
</body>
</html>
